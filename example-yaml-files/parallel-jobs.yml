# ==============================================================================
# GitHub Actions Workflow: Parallel Jobs Demonstration
# File Location: .github/workflows/parallel-jobs.yml
# ==============================================================================

# 'name': The display title of the workflow shown in the GitHub Actions tab.
name: Parallel Jobs Example

# 'on': Specifies the events that trigger this workflow.
on:
  # Trigger 1: Automatically execute when code is pushed to 'main' or 'development'.
  push:
    branches:
      - main
      - development

  # Trigger 2: Allow manual execution directly from the GitHub Actions web UI.
  workflow_dispatch:

# 'jobs': Groups together all the jobs defined in this workflow.
# In GitHub Actions, any jobs that do NOT declare a 'needs' dependency will
# automatically be scheduled and executed in PARALLEL by default!
jobs:

  # ============================================================================
  # FIRST PARALLEL JOB: job-one
  # GitHub assigns an isolated Ubuntu virtual machine to run this job.
  # ============================================================================
  job-one:
    # 'name': Human-readable label displayed in the GitHub Actions visualization graph.
    name: Job One
    # 'runs-on': Allocates a fresh, independent Ubuntu Linux runner for this job.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Print welcome message for Job One
      # Using '|' literal block scalar avoids any YAML plain scalar colon (: ) conflicts.
      - name: Display Job One Message
        run: |
          echo "Hello from Job One"

      # Step 2: Print details and completion for Job One
      - name: Display Job One Details
        run: |
          echo "This is the first parallel job"
          echo "Job One execution completed"

  # ============================================================================
  # SECOND PARALLEL JOB: job-two
  # Because job-two has no 'needs' relationship, GitHub runs it simultaneously
  # alongside job-one on a SEPARATE virtual machine.
  # ============================================================================
  job-two:
    # 'name': Human-readable label displayed in the GitHub Actions visualization graph.
    name: Job Two
    # 'runs-on': Allocates its own separate, independent Ubuntu Linux runner.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Print welcome message for Job Two
      - name: Display Job Two Message
        run: |
          echo "Hello from Job Two"

      # Step 2: Print details and completion for Job Two
      - name: Display Job Two Details
        run: |
          echo "This is the second parallel job"
          echo "Job Two execution completed"

  # ============================================================================
  # THIRD PARALLEL JOB: job-three
  # Runs concurrently alongside job-one and job-two on yet another virtual machine.
  # ============================================================================
  job-three:
    # 'name': Human-readable label displayed in the GitHub Actions visualization graph.
    name: Job Three
    # 'runs-on': Allocates its own separate, independent Ubuntu Linux runner.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Print welcome message for Job Three
      - name: Display Job Three Message
        run: |
          echo "Hello from Job Three"

      # Step 2: Print details and completion for Job Three
      - name: Display Job Three Details
        run: |
          echo "This is the third parallel job"
          echo "Job Three execution completed"


# How Parallel Execution Works
# What is a Job in GitHub Actions?

# A job is a collection of steps that execute sequentially on a single runner environment. By default:

# Steps inside a job run sequentially (Step 1 
# →
# → Step 2 
# →
# → Step 3).
# Jobs inside a workflow run in parallel unless configured otherwise!
# How Does GitHub Identify Independent Jobs?

# GitHub Actions inspects the dependency graph of your workflow:

# It scans each job under jobs:.
# It checks whether the job contains a needs: keyword.
# If a job has no needs attribute, GitHub determines that it has zero dependencies and immediately assigns it to the next available runner.
# Because job-one, job-two, and job-three have no needs declarations, GitHub dispatches all three simultaneously.
# 4. Parallel Jobs vs. Sequential Jobs
# Feature	Parallel Jobs (Default)	Sequential Jobs (Using needs)
# Declaration	No needs: keyword declared	Uses needs: <job_id>
# Execution Order	Run simultaneously at the same time	Wait for upstream jobs to finish successfully
# Runners Provisioned	Multiple virtual machines concurrently	One virtual machine after another
# Total Wall-Clock Time	Fastest: Time taken = slowest individual job	Longer: Time taken = sum of all jobs combined
# Typical Use Case	Running frontend tests, backend tests, and security scans at the same time	Build 
# →
# → Test 
# →
# → Deploy to Production
# What Happens When We Use the needs Keyword?

# If we updated job-two to declare needs: job-one:

# yaml
# job-two:
#   needs: job-one

# Then job-two would not start immediately. It would stay in a "Queued / Waiting" state until job-one completes with exit code 0. If job-one failed, job-two would be skipped entirely.

# 5. Critical Concept: Runner Environment Isolation

# IMPORTANT

# Files and environment variables are NEVER shared between parallel jobs!

# job-one runs on Virtual Machine A.
# job-two runs on Virtual Machine B.
# job-three runs on Virtual Machine C.

# If job-one downloads source code, creates a file, or exports an environment variable, job-two cannot see it. If parallel jobs need to share data, they must use:

# actions/upload-artifact and actions/download-artifact to transfer files.
# outputs: and the needs context to pass text values.
# 6. Expected Execution Visualization & Logs

# In the GitHub Actions web interface, the execution graph will visually show three parallel branch nodes under the workflow run:

# text
#               Parallel Execution
#                      │
#          ┌───────────┼───────────┐
#          ▼           ▼           ▼
#      [Job One]   [Job Two]  [Job Three]
#          │           │           │
#       Step 1      Step 1      Step 1
#          │           │           │
#       Step 2      Step 2      Step 2
#          │           │           │
#       Success     Success     Success

