# 2. What are Job Outputs and Why Do We Need Them?

# Every job in GitHub Actions executes inside its own isolated, ephemeral virtual machine. When Job A finishes, its entire filesystem and environment memory are destroyed.

# If Job A computes a value at runtime (such as an auto-generated semantic version v2.4.1, a Docker image tag, or a deployment environment flag), Job B cannot see it unless it is explicitly exported as a Job Output.

# 3. Step Outputs vs. Job Outputs: The Two-Stage Data Flow

# Passing dynamic data across jobs is a two-step handshake:

# text
# Step in Job A
#     │
#     │  (echo "key=value" >> "$GITHUB_OUTPUT")
#     ▼
# Step Output
#     │
#     │  (Exposed in Job A's 'outputs:' mapping)
#     ▼
# Job Output
#     │
#     │  (Accessed in Job B via '${{ needs.JobA.outputs.key }}')
#     ▼
# Step in Job B
# Comparison Matrix:
# Dimension	Step Outputs	Job Outputs
# Where Defined	Inside a step using echo "key=val" >> "$GITHUB_OUTPUT"	At the top of a job using the outputs: block
# Access Syntax	${{ steps.<step_id>.outputs.<name> }}	${{ needs.<job_id>.outputs.<name> }}
# Scope / Availability	Only within other steps of the same job	In downstream jobs that declare needs:
# Purpose	Local step-to-step data passing	Cross-job virtual machine data passing
# 4. Key Directives & Concepts Explained
# A. What is $GITHUB_OUTPUT?

# $GITHUB_OUTPUT is an environment variable provided by GitHub that points to a special temporary file on the runner.

# Appending name=sample-app to this file registers name as an output for that step.
# (Note: This replaces the deprecated ::set-output syntax).
# B. What is the Purpose of id: in a Step?

# A step must have an id: (e.g. id: app) to give it a unique namespace. Without an id, downstream steps and the job's outputs: block cannot locate where the output was produced.

# C. Why is the needs: Keyword Mandatory?

# Because GitHub Actions runs jobs in parallel by default, Job B does not know when Job A finishes. Declaring needs: generate ensures:

# Job B pauses until Job A finishes successfully.
# GitHub automatically populates the needs.generate.outputs context with Job A's exported values.
# 5. Additional Practical Patterns
# Pattern 1: Multi-Job Fan-In (Consuming from Multiple Upstream Jobs)
# yaml
# jobs:
#   summary:
#     runs-on: ubuntu-latest
#     # Waits for BOTH build and test jobs to complete
