# ==============================================================================
# GitHub Actions Workflow: Job Outputs Demonstration
# File Location: .github/workflows/job-outputs.yml
# ==============================================================================

# 'name': The display title of the workflow shown in the GitHub Actions tab.
name: Job Outputs Example

# 'on': Specifies the events that trigger this workflow.
on:
  # Trigger 1: Automatically execute when code is pushed to 'main' or 'development'.
  push:
    branches:
      - main
      - development

  # Trigger 2: Allow manual execution directly from the GitHub Actions web UI.
  workflow_dispatch:

# 'jobs': Groups together all the jobs defined in this workflow.
jobs:

  # ============================================================================
  # 1. GENERATE JOB
  # Generates dynamic values at runtime, writes them to $GITHUB_OUTPUT,
  # and exposes them at the job level so downstream jobs can consume them!
  # ============================================================================
  generate:
    name: Generate Job Outputs
    runs-on: ubuntu-latest

    # 'outputs': Maps internal step outputs to publicly accessible job-level outputs.
    # Syntax: <output_name>: ${{ steps.<step_id>.outputs.<step_output_name> }}
    outputs:
      app_name: ${{ steps.app.outputs.name }}
      app_version: ${{ steps.app.outputs.version }}
      environment: ${{ steps.app.outputs.environment }}

    steps:
      # Step 1: Generate dynamic metadata and append to $GITHUB_OUTPUT
      # Using '|' literal block scalar avoids any YAML plain scalar colon (: ) conflicts.
      - name: Generate Application Details
        id: app
        run: |
          echo "=== 1. Writing Dynamic Values to GITHUB_OUTPUT ==="
          echo "name=sample-app" >> "$GITHUB_OUTPUT"
          echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          echo "environment=development" >> "$GITHUB_OUTPUT"
          echo "Successfully generated and registered 3 step outputs!"

  # ============================================================================
  # 2. READ-OUTPUTS JOB
  # Consumes outputs from the 'generate' job using the 'needs' context.
  # ============================================================================
  read-outputs:
    name: Read Job Outputs
    runs-on: ubuntu-latest

    # 'needs: generate': Required! Grants access to the 'generate' job's outputs.
    needs: generate

    steps:
      - name: Display Job Outputs
        run: |
          echo "=== 2. Accessing Outputs via needs Context ==="
          echo "Application Name:    ${{ needs.generate.outputs.app_name }}"
          echo "Application Version: ${{ needs.generate.outputs.app_version }}"
          echo "Target Environment:  ${{ needs.generate.outputs.environment }}"

  # ============================================================================
  # 3. USE-ENV JOB
  # Demonstrates mapping upstream job outputs directly into job-level environment variables!
  # ============================================================================
  use-env:
    name: Use Outputs as Environment Variables
    runs-on: ubuntu-latest

    # Depend on 'generate' job to read its outputs
    needs: generate

    # 'env': Maps upstream job outputs to standard environment variables for all steps
    env:
      APP_NAME: ${{ needs.generate.outputs.app_name }}
      APP_VERSION: ${{ needs.generate.outputs.app_version }}

    steps:
      - name: Display Environment Variables
        run: |
          echo "=== 3. Consuming Job Outputs via Environment Variables ==="
          echo "Application (via \$APP_NAME):    $APP_NAME"
          echo "Version (via \$APP_VERSION):    $APP_VERSION"

  # ============================================================================
  # 4. CONDITIONAL JOB
  # Demonstrates using an upstream job output inside an 'if' conditional statement.
  # ============================================================================
  conditional-job:
    name: Conditional Job
    runs-on: ubuntu-latest

    # Depend on 'generate' job
    needs: generate

    # 'if': Evaluates whether the generated environment output equals 'development'
    # Evaluated BEFORE the runner is provisioned!
    if: needs.generate.outputs.environment == 'development'

    steps:
      - name: Display Conditional Message
        run: |
          echo "=== 4. Conditional Job Executed ==="
          echo "Condition Matched: 'development' environment detected from upstream output!"

  # ============================================================================
  # 5. BUILD JOB
  # Generates a second set of outputs (status and artifact name) while also depending on 'generate'.
  # ============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    # Depend on 'generate' job
    needs: generate

    # Expose build results as job-level outputs
    outputs:
      build_status: ${{ steps.result.outputs.status }}
      artifact_name: ${{ steps.result.outputs.artifact }}

    steps:
      - name: Build Application
        run: |
          echo "=== 5. Building Application ==="
          echo "Building ${{ needs.generate.outputs.app_name }} version ${{ needs.generate.outputs.app_version }}..."

      - name: Set Build Outputs
        id: result
        run: |
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "artifact=sample-app-build" >> "$GITHUB_OUTPUT"
          echo "Build completed successfully!"

  # ============================================================================
  # 6. SUMMARY JOB (MULTI-JOB FAN-IN)
  # Waits for BOTH 'generate' and 'build' jobs, consolidating outputs from both sources!
  # ============================================================================
  summary:
    name: Final Job Summary
    runs-on: ubuntu-latest

    # Declares dependencies on MULTIPLE jobs simultaneously
    needs: [generate, build]

    steps:
      - name: Display Final Summary
        run: |
          echo "=== 6. Consolidated Multi-Job Outputs Summary ==="
          echo "Application:  ${{ needs.generate.outputs.app_name }}"
          echo "Version:      ${{ needs.generate.outputs.app_version }}"
          echo "Build Status: ${{ needs.build.outputs.build_status }}"
          echo "Artifact:     ${{ needs.build.outputs.artifact_name }}"
          echo "All job outputs successfully passed and verified across the pipeline!"


    # Evaluated BEFORE the runner is provisioned!
    if: needs.generate.outputs.environment == 'development'
    steps:
      - name: Display Conditional Message
        run: |
          echo "=== 4. Conditional Job Executed ==="
          echo "Condition Matched: 'development' environment detected from upstream output!"
  # ============================================================================
  # 5. BUILD JOB
  # Generates a second set of outputs (status and artifact name) while also depending on 'generate'.
  # ============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    # Depend on 'generate' job
    needs: generate
    # Expose build results as job-level outputs
    outputs:
      build_status: ${{ steps.result.outputs.status }}
      artifact_name: ${{ steps.result.outputs.artifact }}
    steps:
      - name: Build Application
        run: |
          echo "=== 5. Building Application ==="
          echo "Building ${{ needs.generate.outputs.app_name }} version ${{ needs.generate.outputs.app_version }}..."
      - name: Set Build Outputs
        id: result
        run: |
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "artifact=sample-app-build" >> "$GITHUB_OUTPUT"
          echo "Build completed successfully!"
  # ============================================================================
  # 6. SUMMARY JOB (MULTI-JOB FAN-IN)
  # Waits for BOTH 'generate' and 'build' jobs, consolidating outputs from both sources!
  # ============================================================================
  summary:
    name: Final Job Summary
    runs-on: ubuntu-latest
    # Declares dependencies on MULTIPLE jobs simultaneously
    needs: [generate, build]
    steps:
      - name: Display Final Summary
        run: |
          echo "=== 6. Consolidated Multi-Job Outputs Summary ==="
          echo "Application:  ${{ needs.generate.outputs.app_name }}"
          echo "Version:      ${{ needs.generate.outputs.app_version }}"
          echo "Build Status: ${{ needs.build.outputs.build_status }}"
          echo "Artifact:     ${{ needs.build.outputs.artifact_name }}"
          echo "All job outputs successfully passed and verified across the pipeline!"




