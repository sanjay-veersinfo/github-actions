# 6. Senior DevOps Limitations & Best Practices
# Job Outputs are Strictly Strings: Even if you write status=true or count=42, GitHub Actions treats them as string literals ("true" and "42").
# Outputs are for Metadata, NOT Files:
# Use Job Outputs for: Short strings, version numbers, commit hashes, URLs, status flags, and branch names (
# <
# 1
# <1 MB).
# Use Artifacts for: Binary builds, .jar files, Docker image tarballs, and compiled frontend bundles (using actions/upload-artifact@v4).
# Never Store Secrets in Outputs: Job outputs are displayed in plaintext within the GitHub Actions API and UI. Never pass passwords, tokens, or private keys through $GITHUB_OUTPUT.
# Handling Multiline Outputs Safely: If an output contains multiple lines (e.g. a Git changelog), use an EOF delimiter:
# bash
# {
#   echo "changelog<<EOF"
#   git log --oneline -3
#   echo "EOF"
# } >> "$GITHUB_OUTPUT"
