# 7. Common Pitfalls & Solutions

# CAUTION

# Pitfall 1: Attempting to Define Reviewers in YAML
# ❌ Mistake: Writing reviewers: [octocat] inside workflow YAML.
# ✔ Fact: GitHub Actions does not support configuring required reviewers via YAML. Reviewers must be configured in repository Settings 
# →
# → Environments.

# WARNING

# Pitfall 2: Omission of needs: deploy-development
# If needs is omitted, the production approval prompt will appear immediately when the workflow starts, rather than waiting for development deployment verification.

# TIP

# Pitfall 3: Fallback Values in YAML Expressions
# In our workflow, we use:

# yaml
# APP_ENV: ${{ vars.APP_ENV || 'Development' }}

# This defensive pattern ensures that if someone triggers the workflow before configuring environment variables in GitHub settings, the workflow logs meaningful default strings instead of blank lines.

# 8. Step-by-Step UI Verification & Testing Guide
# Inspect Workspace Status:
# bash
# git status
# Commit and Push:
# bash
# git add .github/workflows/environments-approvals.yml
# git commit -m "ci: add environments and approval gates demo workflow"
# git push origin main
# Trigger Workflow via GitHub Actions UI:
# Go to your repository on GitHub.
# Click the Actions tab.
# Select Environment Deployment and Approval Demo in the left sidebar.
# Click Run workflow 
# →
# → select branch main 
# →
# → click the green Run workflow button.
# Observe the Approval Gate in Action:
# The deploy-development job runs and completes.
# Notice deploy-production transitions to a yellow badge: "Waiting for review".
# An amber notification banner appears: "deploy-production requires approval from required reviewers".
# Click Review deployments 
# →
# → check production 
# →
# → optionally leave a comment 
# →
# → click Approve and deploy.
# The production job unlocks and finishes executing.