# 4. Key Mechanics & Concepts Explained
# A. Environment Binding (environment: name)

# When a job declares environment: production:

# GitHub pauses job execution if protection rules (e.g., reviewers or timers) are enabled.
# Once approved, GitHub populates the ${{ vars }} and ${{ secrets }} contexts with values scoped specifically to production.
# If an environment variable is defined at both the Repository level and the Environment level, the Environment value takes precedence.
# B. Comparison: vars vs. env vs. secrets
# Context / Keyword	Scope	Sensitivity	Where Configured
# vars	Repository or Environment	Plain text (non-sensitive configuration like URLs, environment names)	GitHub Settings 
# →
# → Environments / Variables
# secrets	Repository or Environment	Encrypted & Masked (API keys, deployment tokens, passwords)	GitHub Settings 
# →
# → Secrets
# env	Workflow, Job, or Step	Plain text runtime environment variables passed to shells	Defined inline directly in YAML
# C. Sequential Staged Rollouts (needs: deploy-development)

# Without needs: deploy-development, both jobs would execute in parallel. Using needs guarantees that production deployment only triggers after development deployment completes with exit code 0.

# D. Environment URL (url: https://example.com)

# GitHub Actions displays a clickable View deployment button on the workflow run page, commit history, and pull request timeline, allowing developers to jump directly to the target environment.

