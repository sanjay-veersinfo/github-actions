# Triggering in GitHub Actions
# Commit and push the .github/workflows/matrix-basics.yml file to your remote GitHub repository:
# bash
# git add .github/workflows/matrix-basics.yml
# git commit -m "ci: add matrix strategy basics demo workflow"
# git push origin main
# Navigate to your repository on GitHub and click the Actions tab.
# Select Matrix Strategy Basics from the left-hand workflow list.
# Click Run workflow 
# →
# → choose your branch 
# →
# → click the green Run workflow button.
# In the workflow run summary, notice how GitHub Actions expands each matrix job into individual sub-jobs (e.g., Test on Node.js 20, Test on Node.js 22, etc.), displaying individual logs, timings, and statuses for each target.


