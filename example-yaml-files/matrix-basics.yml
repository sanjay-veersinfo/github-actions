# )

# In our multi-dimension-test job:

# node-version: [20, 22] (length: 2)
# os: [ubuntu-latest, windows-latest] (length: 2)
# Total Generated Jobs: 
# 2
# ×
# 2
# =
# 4
#  jobs
# 2×2=4 jobs.
# C. fail-fast: false vs fail-fast: true
# fail-fast: true (Default): If any matrix job fails, GitHub Actions cancels all other currently running matrix jobs immediately to save runner minutes.
# fail-fast: false (Recommended for cross-version CI): Prevents cancellation. If Node.js 20 encounters a syntax error, Node.js 22 will continue executing until completion so you get a full test report across all targets.
# D. max-parallel: <number>

# By default, GitHub Actions runs as many matrix jobs in parallel as your runner quota permits. max-parallel: 2 limits concurrent execution to a maximum of 2 jobs at any given moment, queueing the rest until one finishes. This is useful when running against resource-constrained shared databases or third-party APIs with rate limits.

# E. include vs exclude
# include:
# Enriches an existing combination with extra metadata/variables (e.g., attaching environment: production only to Node.js 22).
# Can also append an entirely new standalone combination that wasn't part of the base Cartesian matrix.
# exclude:
# Drops specific combinations that are unsupported (e.g., an older Node version that has known incompatibilities on Windows).

# 4. Matrix Execution Breakdown Tables
# Example 1: node-matrix-test (Single Dimension)
# Job Index	Matrix Variable (matrix.node-version)	Target Runner	Executed Command
# Job 1	20	ubuntu-latest	actions/setup-node@v4 with Node 20 
# →
# → npm test
# Job 2	22	ubuntu-latest	actions/setup-node@v4 with Node 22 
# →
