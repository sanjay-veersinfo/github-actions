# Example 2: multi-os-test (Cross-Platform)
# Job Index	Matrix Variable (matrix.os)	Dynamic runs-on	Operating System
# Job 1	ubuntu-latest	ubuntu-latest	Ubuntu Linux runner
# Job 2	windows-latest	windows-latest	Windows Server runner
# Job 3	macos-latest	macos-latest	Apple macOS runner
# Example 3: multi-dimension-test (Cartesian Product)
# Job Index	matrix.node-version	matrix.os	Combinations Produced
# Job 1	20	ubuntu-latest	Node 20 on Linux
# Job 2	20	windows-latest	Node 20 on Windows
# Job 3	22	ubuntu-latest	Node 22 on Linux
# Job 4	22	windows-latest	Node 22 on Windows
# Example 4: exclude-example
# Original Combination	Status	Reason
# Node 20 on Ubuntu	Executed	Included in matrix
# Node 20 on Windows	Excluded	Filtered by exclude rule
# Node 22 on Ubuntu	Executed	Included in matrix
# Node 22 on Windows	Executed	Included in matrix
