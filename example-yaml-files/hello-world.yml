# 4. YAML Structure Explanation (Line-by-Line Breakdown)
# 4.1 Deconstructing Example 1: Basic Configuration
# app: (Root Parent Key) Defines the application metadata group.
# name: "E-Commerce Gateway": Child string value identifying the app name.
# version: "2.4.1": SemVer version string. Always quoted so parsers do not treat version numbers like 2.4 as floats.
# maintenance_mode: false: Boolean flag disabling maintenance mode.
# timeout_seconds: 30: Integer representing connection threshold in seconds.
# cache_ratio: 0.85: Float scalar parsed as floating-point precision.
# deprecation_notice: null: Explicit absence of a value (equivalent to Java null or Go nil).
# server: (Root Parent Key) Network listening configuration.
# host: "0.0.0.0": Binds to all network interfaces.
# port: 8080: Listening TCP port.
# ssl:: Nested child mapping under server.
# enabled: true: Enables TLS/HTTPS.
# certificate_path: "/etc/ssl/certs/server.crt": Filesystem path to public cert.
# cors: (Root Parent Key) Cross-Origin Resource Sharing settings.
# allowed_origins:: List parent key.
# - "https://app.example.com": List entry 1 (string).
# - "https://admin.example.com": List entry 2 (string).
# - "http://localhost:3000": List entry 3 (string for local frontend dev).
# 4.2 Deconstructing Example 2: Spring Boot application.yml
# server:
# port: 8080: Maps to Spring Boot's server.port property.
# servlet.context-path: /api/v1: Prefixes all REST endpoints with /api/v1.
# spring: Root object mapping directly to Spring Boot autoconfiguration.
# application.name: order-service: Registers the microservice name in Spring ApplicationContext.
# datasource: Database connection block.
# url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}:
# Hierarchy: spring.datasource.url.
# Interpretation: Spring inspects runtime environment variables. If DB_HOST is set in the OS/Docker, it injects it; otherwise, it falls back to localhost.
# username: ${DB_USERNAME:postgres}: Injects database username.
# password: ${DB_PASSWORD:postgres123}: Injects database password.
# driver-class-name: org.postgresql.Driver: Full Java package path for PostgreSQL JDBC driver.
# hikari: Database connection pool settings (HikariCP).
# maximum-pool-size: 10: Max active connections allowed.
# jpa: Java Persistence API and Hibernate configurations.
# hibernate.ddl-auto: update: Tells Hibernate to automatically synchronize database tables with Java @Entity models.
# show-sql: true: Prints generated SQL queries to console.
# properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect: Explicit SQL dialect optimization.
# logging:
# level.root: INFO: Default logging threshold for third-party libraries.
# level.com.example.orderservice: DEBUG: Custom application package set to verbose DEBUG level.
# 4.3 Deconstructing Example 3: docker-compose.yml
# services: Root key declaring all containers to be run.
# backend: Service identifier.
# build: Instructs Docker Compose to build a custom image.
# context: .: Working directory containing source code.
# dockerfile: Dockerfile: Target Dockerfile name.
# container_name: order-service-app: Explicit human-readable container name.
# restart: always: Restarts the container automatically on crash or host reboot.
# ports: List of port forwardings.
# - "8080:8080": HOST_PORT:CONTAINER_PORT. Quoted so YAML doesn't interpret numbers with colons as sexagesimal (base-60).
# environment: Injects OS environment variables into the container runtime.
# DB_HOST: postgres-db: Uses Docker's internal DNS resolution to point to the other service.
# depends_on: Startup dependency control.
# condition: service_healthy: Backend will wait to start until PostgreSQL passes its healthcheck!
# networks: Attaches the container to app-network.
# postgres-db: Database container definition.
# image: postgres:15-alpine: Pre-built lightweight PostgreSQL image pulled from Docker Hub.
# volumes: Storage persistence.
# - postgres-data:/var/lib/postgresql/data: Maps named volume postgres-data to Postgres storage dir so data survives container destructions.
# healthcheck: Verifies database readiness before downstream containers connect.
# test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]: Runs PostgreSQL readiness CLI.
# volumes: Root key declaring persistent named storage volumes.
# networks: Root key declaring custom network bridge for isolated inter-container communication.
# 4.4 Deconstructing Example 4: GitHub Actions deploy.yml
# name: CI/CD Deployment Pipeline: Workflow display title shown in GitHub UI.
# on: Event trigger mapping.
# push.branches: Executes pipeline whenever code is pushed to development or main.
# pull_request.branches: Executes pipeline on PR creation against development.
# jobs: Root map of jobs running on GitHub runners.
# build-and-deploy: Unique job ID.
# runs-on: ubuntu-latest: Specifies the virtual machine runner environment (Ubuntu Linux).
# steps: Sequential list of tasks executed in order.
# - name: Checkout Source Code: Human-friendly step name.
# uses: actions/checkout@v4: Reusable GitHub Action cloning the repository.
# - name: Set up JDK 17: Configures Java compiler.
# with: Input parameters passed to the action (java-version: '17').
# - name: Build Application with Maven:
# run: mvn clean package -DskipTests: Executes a shell command directly on the Ubuntu runner.
# - name: Log in to Docker Hub:
# uses: docker/login-action@v3:
# username: ${{ secrets.DOCKERHUB_USERNAME }}: Securely reads encrypted token from GitHub Repository Secrets.
# - name: Deploy to Ubuntu Server via SSH:
# uses: appleboy/ssh-action@v1.0.3: Establishes SSH connection to target production VM.
# script: |: Multi-line bash commands executed remotely on the production server.
# 5. Common YAML Mistakes and How to Fix Them
# Mistake 1: Using Tabs Instead of Spaces
# Problem: The YAML specification strictly forbids tab characters (\t). A single tab produces a fatal parse error (parser error: found character that cannot start any token).
# Incorrect:
# yaml
# database:
# 	host: localhost   # <-- Tab inserted here!
# Corrected:
# yaml
# database:
#   host: localhost   # <-- Exactly 2 space characters
# Mistake 2: Missing Space After Colon
# Problem: YAML requires a space between the colon and the value to recognize key-value separation.
# Incorrect:
# yaml
# server:
#   port:8080         # <-- Parsed as key "port:8080" without a value!
# Corrected:
# yaml
# server:
#   port: 8080        # <-- Space added after colon
# Mistake 3: The "Norway Problem" (Boolean vs. String Mismatch)
# Problem: In YAML 1.1, NO is evaluated as the boolean false. Country codes, postal codes, and unquoted strings can trigger subtle production bugs.
# Incorrect:
# yaml
# user:
#   country: NO       # <-- Evaluated by parser as: country: false
#   zip_code: 01234   # <-- Evaluated as octal number: 668!
# Corrected:
# yaml
# user:
#   country: "NO"     # <-- Explicit string
#   zip_code: "01234" # <-- Explicit string preserving leading zero
# Mistake 4: Incorrect List Item Indentation
# Problem: Hyphen not aligned with parent key or missing a space after -.
# Incorrect:
# yaml
# cors:
#   allowed_origins:
#   -http://localhost # <-- Missing space after hyphen
#    -http://test.com # <-- Misaligned indentation
# Corrected:
# yaml
# cors:
#   allowed_origins:
#     - "http://localhost"
#     - "http://test.com"
# Mistake 5: Duplicate Keys in the Same Mapping
# Problem: Having the exact same key twice under the same parent. Depending on the parser, the second key either silently overwrites the first or throws an exception.
# Incorrect:
# yaml
# logging:
#   level: INFO
#   pattern: console
#   level: DEBUG      # <-- Duplicate key! Overwrites INFO or fails
# Corrected:
# yaml
# logging:
#   level: DEBUG
#   pattern: console
# Mistake 6: Unquoted Special Characters (Colons and Asterisks)
# Problem: An asterisk * without quotes is interpreted as a YAML alias reference. A colon with a space inside a string breaks the parser.
# Incorrect:
# yaml
# regex: *.*                 # <-- Parser thinks you are referencing alias ".*"
# commit_message: Fix: bug   # <-- Colon followed by space confuses parser
# Corrected:
# yaml
# regex: "*.*"
# commit_message: "Fix: bug"
# 6. YAML Validation, Tooling, and Best Practices
# 6.1 How to Validate YAML Files

# You can validate YAML syntax locally using common CLI tools:

# Using Python (Pre-installed on most systems)
# bash
# python -c "import yaml; yaml.safe_load(open('application.yml'))" && echo "YAML is valid!"
# Using yamllint (Industry Standard Linter)
# bash
# # Install via pip
# pip install yamllint
# # Run against your file or folder
# yamllint 03-docker-compose.yml
# 6.2 Recommended VS Code Extensions
# YAML by Red Hat (redhat.vscode-yaml):
# Auto-formats YAML with 2 spaces.
# Provides JSON Schema validation (auto-completes GitHub Actions, Docker Compose, and Kubernetes manifests based on official schemas).
# Highlights syntax errors and tabs immediately in red.
# GitHub Actions (github.vscode-github-actions):
# Validates .github/workflows/*.yml syntax, parameters, and secret names directly inside the IDE.
# 6.3 Best Practices for Maintaining YAML Configurations
# Always Use 2 Spaces: Configure your IDE editor settings:
# json
# "[yaml]": {
#   "editor.tabSize": 2,
#   "editor.insertSpaces": true
# }
# Quote Ambiguous Strings: Always quote version numbers ("1.0"), dates ("2026-11-12"), and strings containing colons or symbols.
# Use Anchors for Large Repeated Blocks: In multi-service Docker Compose files, use anchors (&) and merges (<<:) to prevent duplication.
# Enforce Linting in CI: Add a yamllint step in your GitHub Actions workflow so broken indentation never reaches production.
# 6.4 Managing Sensitive Information Securely

# CAUTION

# Never commit passwords, private keys, or API tokens directly into YAML files. Any file committed to Git history can be compromised.

# Industry Solutions:
# GitHub Actions Secrets:
# Store secrets in GitHub repo settings (Settings -> Secrets and variables -> Actions).
# Reference them in YAML as: ${{ secrets.DB_PASSWORD }}.
# Docker Compose with Gitignored .env:
# Keep secret declarations in a local .env file added to .gitignore:
# env
# POSTGRES_PASSWORD=my_super_secret_password_123
# Reference in docker-compose.yml as ${POSTGRES_PASSWORD}.
# Spring Boot Externalization:
# Pass secrets as OS environment variables at container launch:
# bash
# docker run -e DB_PASSWORD="secret" my-spring-app:latest
# GitOps & Production Secrets:
# Tools like Mozilla SOPS or Sealed Secrets encrypt sensitive values inside YAML so they can be safely stored in Git and decrypted only inside the Kubernetes cluster or production server.
# 7. Real-World Project Structure & Usage in Your Stack

# Here is how YAML files fit into a production full-stack microservices repository (Spring Boot + Go + React + PostgreSQL + Docker + GitHub Actions):

# text
# my-project/
# │
# ├── .github/
# │   └── workflows/
# │       ├── backend-ci.yml           # Runs Maven build, unit tests, Docker push
# │       ├── frontend-ci.yml          # Runs npm build, React tests
# │       └── deploy.yml               # SSH deployment to Ubuntu production server
# │
# ├── backend-spring/                  # Java 17 + Spring Boot
# │   ├── src/
# │   │   └── main/
# │   │       └── resources/
# │   │           ├── application.yml         # Base configuration
# │   │           ├── application-dev.yml     # Local dev profile (Postgres on localhost)
# │   │           └── application-prod.yml    # Production profile (Reads env vars)
# │   ├── Dockerfile
# │   └── pom.xml
# │
# ├── backend-go/                      # High-performance Go microservice
# │   ├── config/
# │   │   └── config.yaml              # Loaded by Viper library into Go structs
# │   ├── Dockerfile
# │   └── main.go
# │
# ├── frontend-react/                  # React Single Page App
# │   ├── Dockerfile                   # Multi-stage build with Nginx
# │   └── package.json
# │
# ├── docker-compose.yml               # Local orchestration (Spring + Go + Postgres)
# ├── docker-compose.prod.yml          # Production overrides for Ubuntu server
# └── .env.example                     # Example environment template
# How YAML is Handled During Execution:
# Build Time: GitHub Actions reads .github/workflows/deploy.yml to sequence build and test commands.
# Orchestration Time: Docker engine on your Ubuntu server reads docker-compose.yml to create container networks, mount PostgreSQL data volumes, and bind host ports.
# Runtime: Spring Boot's internal SnakeYAML library reads application.yml, parses the tree into Spring's Environment, and binds values to Java @Value annotations or @ConfigurationProperties classes.
# 8. Learning Exercises and Solutions
# 8.1 Beginner Exercises
# Exercise 1: Format a Personal Profile
# Task: Create a YAML representation of a software developer with keys: name, age, role, skills (a list of 3 languages), and available_for_hire (boolean).
# Solution:
# yaml
# developer:
#   name: "Sanjay"
#   age: 26
#   role: "DevOps Engineer"
#   skills:
#     - Java
#     - Go
#     - Python
#   available_for_hire: true
# Explanation: Demonstrates string quoting, integer, list of strings, and boolean scalar.
# Exercise 2: Fix the Indentation
# Task: Identify and fix the syntax errors in this snippet:
# yaml
# database:
#   host: localhost
#  port: 5432
#   credentials:
#   username: admin
# Solution:
# yaml
# database:
#   host: localhost
#   port: 5432
#   credentials:
#     username: admin
# Explanation: port was misaligned by 1 space, and username must be indented under its parent credentials.
# Exercise 3: Web Server Settings
# Task: Write a configuration for an Nginx web server with listen_port 80, server_name "example.com", and routes mapping / to /var/www/html and /api to http://localhost:8080.
# Solution:
# yaml
# server:
#   listen_port: 80
#   server_name: "example.com"
#   routes:
#     - path: "/"
#       proxy_pass: "/var/www/html"
#     - path: "/api"
#       proxy_pass: "http://localhost:8080"
# Explanation: Shows nested maps inside an array (routes).
# Exercise 4: Convert JSON to YAML
# Task: Convert the following JSON to clean YAML block style: {"status":"success","code":200,"data":{"orders":[101,102,103]}}
# Solution:
# yaml
# status: "success"
# code: 200
# data:
#   orders:
#     - 101
#     - 102
#     - 103
# Explanation: Converts nested JSON curly braces and square brackets into whitespace indentation and hyphens.
# Exercise 5: Representing Null and Multiline
# Task: Write a YAML key notes containing a 2-line warning message, and a key external_token with an explicit null value.
# Solution:
# yaml
# notes: |
#   Warning: Do not alter configuration during deployment.
#   Contact operations for questions.
# external_token: null
# Explanation: Uses | to preserve the 2 distinct lines and null to explicitly represent an empty value.
# 8.2 Intermediate Exercises
# Exercise 6: Spring Boot Logging Profile
# Task: Write a Spring Boot logging: block that sets root level to WARN, sets org.springframework.security to DEBUG, and sets log file path to /var/log/app.log.
# Solution:
# yaml
# logging:
#   file:
#     name: "/var/log/app.log"
#   level:
#     root: WARN
#     org.springframework.security: DEBUG
# Explanation: Maps directly to Spring Boot's hierarchical logging properties.
# Exercise 7: Docker Compose Port Mapping Quoting
# Task: Write a Docker Compose service named redis using image redis:7-alpine, with port 6379:6379, and an environment variable ALLOW_EMPTY_PASSWORD: "yes". Explain why quotes are required.
# Solution:
# yaml
# services:
#   redis:
#     image: redis:7-alpine
#     ports:
#       - "6379:6379"
#     environment:
#       ALLOW_EMPTY_PASSWORD: "yes"
# Explanation: Without quotes, 6379:6379 could be parsed as base-60 sexagesimal, and yes would be converted to the boolean true instead of the string "yes".
# Exercise 8: Multi-Stage GitHub Actions Matrix
# Task: Create a GitHub Actions job definition using a build matrix to test on Node versions 18 and 20 across Ubuntu and Windows.
# Solution:
# yaml
# jobs:
#   test:
#     strategy:
#       matrix:
#         os: [ubuntu-latest, windows-latest]
#         node-version: [18, 20]
#     runs-on: ${{ matrix.os }}
#     steps:
#       - uses: actions/setup-node@v4
#         with:
#           node-version: ${{ matrix.node-version }}
# Explanation: Shows flow-style arrays ([18, 20]) and GitHub expression interpolation ${{ matrix.os }}.
# Exercise 9: Advanced Anchors & Aliases
# Task: Use YAML anchors (&) and merge keys (<<:) to define a base microservice template with restart: always and networks: [app-net], and reuse it for user-service and catalog-service.
# Solution:
# yaml
# x-common-service: &service-template
#   restart: always
#   networks:
#     - app-net
# services:
#   user-service:
#     <<: *service-template
#     image: myorg/user-service:1.0
#     ports:
#       - "8001:8001"
#   catalog-service:
#     <<: *service-template
#     image: myorg/catalog-service:1.0
#     ports:
#       - "8002:8002"
# Explanation: x- is standard Docker Compose syntax for reusable extension fields. <<: *service-template merges common configuration without repetition. Check 05-advanced-anchors.yml for another example.
# Exercise 10: Spring Boot DataSource with Fallback
# Task: Configure a Spring Boot datasource URL that reads from an environment variable DATABASE_URL, but defaults to jdbc:postgresql://localhost:5432/testdb if the variable is unset.
# Solution:
# yaml
# spring:
#   datasource:
#     url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/testdb}
# Explanation: Demonstrates Spring Boot's ${VAR_NAME:fallback_value} syntax.
# 8.3 Real-World DevOps Exercises
# DevOps Exercise 1: Production PostgreSQL Container with Volume & Healthcheck
# Scenario: You need to deploy a PostgreSQL 15 database container that automatically initialises commerce_db, stores data persistently on the host, and has a healthcheck so dependent services know when it is ready.
# Solution:
# yaml
# services:
#   database:
#     image: postgres:15-alpine
#     container_name: production-postgres
#     restart: unless-stopped
#     environment:
#       POSTGRES_DB: commerce_db
#       POSTGRES_USER: ${DB_USER:-admin}
#       POSTGRES_PASSWORD: ${DB_PASSWORD}
#     ports:
#       - "127.0.0.1:5432:5432"  # Bound strictly to localhost for security
#     volumes:
#       - postgres_data:/var/lib/postgresql/data
#     healthcheck:
#       test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d commerce_db"]
#       interval: 10s
#       timeout: 5s
#       retries: 5
#       start_period: 10s
# volumes:
#   postgres_data:
#     driver: local
# Explanation:
# Binds port strictly to 127.0.0.1 so the database is not exposed to the public internet.
# Uses healthcheck with start_period to give Postgres 10 seconds to initialize before failure counting begins.
