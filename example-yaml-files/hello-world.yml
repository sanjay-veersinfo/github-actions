# ==============================================================================
# GitHub Actions Workflow: Hello World
# File Location: .github/workflows/hello-world.yml
# ==============================================================================

# 'name': The display title of the workflow shown in the GitHub Actions web interface.
name: Hello World Workflow

# 'on': Specifies the event(s) that trigger the workflow execution.
on:
  # 'workflow_dispatch': Enables manual triggering of the workflow from the GitHub UI,
  # the GitHub CLI ('gh workflow run'), or the GitHub REST API.
  workflow_dispatch:

# 'jobs': Groups together all the automated jobs that run as part of this workflow.
jobs:
  # 'hello-world': Unique identifier (job ID) for this job within the workflow.
  hello-world:
    # 'name': Human-readable label for this specific job displayed in the GitHub UI.
    name: Run Hello World Steps

    # 'runs-on': Defines the operating system and runner environment hosted by GitHub.
    # 'ubuntu-latest' provisions a clean, ephemeral Ubuntu Linux virtual machine.
    runs-on: ubuntu-latest

    # 'steps': A linear, ordered list of tasks executed sequentially inside the runner.
    steps:
      # Step 1: Display a welcome message
      # 'name': Friendly step title displayed in the live execution logs.
      # 'run': Executes commands in the runner's default shell (bash on Ubuntu).
      - name: Print Welcome Message
        run: echo "Hello World! Welcome to GitHub Actions."

      # Step 2: Print Multiple Strings
      # Uses the YAML literal block scalar '|' to execute multiple commands
      # and print multiple strings across distinct lines in a single step.
      - name: Print Multiple Strings
        run: |
          echo "=== String 1: Senior DevOps Engineer Pipeline Demonstration ==="
          echo "=== String 2: Tooling Stack - Spring Boot | Go | React | PostgreSQL ==="
          echo "=== String 3: Infrastructure - Docker Compose & Ubuntu Cloud Server ==="
          echo "=== String 4: GitHub Actions event triggered via workflow_dispatch ==="
          echo "=== String 5: YAML Multi-line block scalar '|' executed successfully ==="

      # Step 3: Display successful completion message
      - name: Workflow Completed
        run: echo "Hello World workflow executed successfully!"


# 1. What is a YAML File?
# 1.1 What Does YAML Stand For?
# Originally (2001): "Yet Another Markup Language" (reflecting its early purpose as a human-friendly markup format).
# Modern Definition (Recursive Acronym): "YAML Ain't Markup Language".
# The creators changed the meaning to emphasize that YAML is a data serialization language (like JSON), not a document markup language (like HTML or XML). It represents pure structured data rather than formatted text with tags.
# 1.2 Purpose of YAML Files

# A YAML file stores structured data in a plain-text format that is both:

# Instantly readable by humans without visual clutter.
# Easily parsable by machines across any programming language (Java, Go, Python, JavaScript, Rust).

# Its primary purpose is configuration management, infrastructure-as-code (IaC), and pipeline orchestration.

# 1.3 Why YAML is Dominant in Software Development & DevOps

# Prior to YAML, systems relied heavily on XML or JSON for configuration:

# Zero Boilerplate: No opening/closing tags (<config></config>), no braces ({}), and minimal commas.
# First-Class Comment Support: Unlike JSON, YAML supports inline comments (#), making it ideal for documenting configuration files and team onboarding.
# Clean Git Diffs: Because YAML is line-oriented, Git commits show crisp single-line changes instead of multi-line comma adjustments.
# Universal Standard: Almost all major modern cloud and DevOps tools (Kubernetes, Docker Compose, GitHub Actions, GitLab CI, Ansible, Prometheus, Helm, OpenAPI/Swagger, Spring Boot) have standardized on YAML.
# 1.4 Where and When Do We Use YAML?
# Domain	Use Case / Tool	Common YAML Files
# Backend Development	Spring Boot, Go (Viper), Node.js, Ruby on Rails	application.yml, config.yaml
# Container Orchestration	Docker, Kubernetes, Helm	docker-compose.yml, deployment.yaml, values.yaml
# CI/CD Automation	GitHub Actions, GitLab CI, Azure Pipelines	.github/workflows/deploy.yml, .gitlab-ci.yml
# Infrastructure & Config	Ansible, Terraform Cloud, Prometheus	playbook.yml, prometheus.yml
# API Documentation	OpenAPI Specification / Swagger	openapi.yaml, swagger.yaml
# 1.5 Comparative Analysis: YAML vs. JSON vs. XML

# To understand YAML's elegance, consider the exact same user configuration represented across all three formats:

# YAML
# yaml
# user:
#   name: Sanjay
#   role: DevOps Engineer
#   skills:
#     - Docker
#     - Kubernetes
#     - Spring Boot
# JSON
# json
# {
#   "user": {
#     "name": "Sanjay",
#     "role": "DevOps Engineer",
#     "skills": [
#       "Docker",
#       "Kubernetes",
#       "Spring Boot"
#     ]
#   }
# }
# XML
# xml
# <user>
#   <name>Sanjay</name>
#   <role>DevOps Engineer</role>
#   <skills>
#     <skill>Docker</skill>
#     <skill>Kubernetes</skill>
#     <skill>Spring Boot</skill>
#   </skills>
# </user>
# Comparison Matrix
# Feature	YAML	JSON	XML
# Primary Focus	Human readability & configuration	High-speed data exchange & APIs	Complex enterprise document modeling
# Visual Complexity	Minimal (whitespace-driven)	Medium (braces, quotes, commas)	High (verbose opening/closing tags)
# Comments Support	Yes (#)	No (forbidden in standard JSON)	Yes (<!-- comment -->)
# Data Types	Strings, Ints, Floats, Booleans, Dates, Null	Strings, Numbers, Booleans, Null	Pure text nodes (requires schema parsing)
# Superset Relationship	YAML 1.2 is a strict superset of JSON	Valid JSON is valid YAML	Distinct family
# Parsing Speed	Moderate	Fast	Moderate to Slow
# Primary Use Cases	Configs, CI/CD, Kubernetes, Docker	REST APIs, Browser-Server data	Enterprise SOAP, Android manifests
# 1.6 File Extensions: .yaml vs. .yml
# .yaml: The official extension recommended by the YAML.org standard.
# .yml: Originated during the MS-DOS / early Windows era where file systems enforced 3-letter extension limits (8.3 filename conventions).
# Technical Difference: None. Every modern parser (Spring Boot, Docker, GitHub Actions, VS Code, Go) treats .yaml and .yml identically.
# Industry Standard Practice: Choose one convention across your repository and remain consistent. For example, Docker Compose and Spring Boot communities historically favor .yml, while Kubernetes manifests frequently use .yaml.
# 2. YAML Syntax and Basic Rules

# YAML’s syntax is clean because it uses indentation to denote structure instead of brackets.

# 2.1 Key-Value Pairs

# Data is stored as key: value.

# yaml
# # Note the mandatory space after the colon
# name: Order Service
# port: 8080
# status: active

# IMPORTANT

# The colon (:) must be followed by a space. Writing port:8080 is invalid YAML syntax.

# 2.2 Indentation and Spacing
# Spaces Only: YAML strictly forbids TAB characters for indentation. Pressing Tab in an editor must insert spaces.
# Consistent Spacing: The industry standard is 2 spaces per indentation level.
# Elements at the same indentation level belong to the same hierarchy.
# yaml
# # Correct: 2-space indentation
# server:
#   host: localhost
#   port: 8080
# # Incorrect: Tab character or mismatched spacing causes immediate parser failure
# 2.3 Nested Objects (Mappings)

# To create child objects, increase the indentation under the parent key:

# yaml
# database:
#   connection:
#     host: 127.0.0.1
#     port: 5432
#   pool:
#     min_size: 5
#     max_size: 20
# 2.4 Lists and Arrays

# There are two ways to represent lists in YAML:

# Block Style (Standard in DevOps)

# Each item begins with a hyphen followed by a space (-):

# yaml
# environments:
#   - development
#   - staging
#   - production
# Flow Style (Inline / JSON-compatible)

# Enclosed in square brackets:

# yaml
# environments: [development, staging, production]
# List of Objects (Very common in Kubernetes and Docker)
# yaml
# users:
#   - id: 101
#     name: Alice
#     role: Admin
#   - id: 102
#     name: Bob
#     role: Developer
# 2.5 Strings and Numbers
# Integers & Floats: Handled automatically without quotes.
# yaml
# item_count: 42
# price: 19.99
# ratio: 1.2e+3
# Strings: Usually do not require quotation marks unless they contain special characters.
# yaml
# simple_string: hello world
# single_quoted: 'Preserves literal string, no escapes parsed'
# double_quoted: "Supports escapes like \n and \"escaped quotes\""
# 2.6 Boolean Values

# Booleans represent true or false.

# yaml
# is_active: true
# debug_enabled: false

# WARNING

# In older YAML 1.1 specifications, words like yes, no, on, off were evaluated as booleans. This caused the famous "Norway Problem": If you configured country codes as country: NO, YAML evaluated it as country: false! Senior Practice: Always use explicit true / false, or wrap codes in quotes: country: "NO".

# 2.7 Null Values

# Null can be written using null, a tilde (~), or simply leaving the value empty:

# yaml
# description: null
# notes: ~
# metadata:
# 2.8 Comments

# Single-line comments begin with #:

# yaml
# # This is a full-line comment
# timeout: 60 # This is an inline comment

# (YAML does not support multi-line block comments like /* ... */. Use multiple # lines).

# 2.9 Multi-Line Strings: Literal (|) vs. Folded (>)

# When writing scripts, certificates, or long descriptions:

# The Literal Indicator (|) – Preserves Newlines

# Maintains exact line breaks. Used for bash scripts and SSH keys.

# yaml
# script: |
#   echo "Step 1: Preparing build"
#   echo "Step 2: Executing tests"
#   echo "Step 3: Done"

# Result in memory: "echo \"Step 1...\"\necho \"Step 2...\"\necho \"Step 3...\"\n"

# The Folded Indicator (>) – Replaces Newlines with Spaces

# Folds multiple lines into a single long string, keeping double line breaks as new paragraphs:

# yaml
# description: >
#   This is a very long description
#   that spans multiple lines in the source
#   file for readability, but becomes a single line.

# Result in memory: "This is a very long description that spans multiple lines in the source file for readability, but becomes a single line.\n"

# Chomping Modifiers:
# |- or >- (Strip): Removes all trailing newlines.
# |+ or >+ (Keep): Keeps all trailing empty lines.
# | or > (Clip - default): Keeps exactly one trailing newline.
# 2.10 Anchors (&), Aliases (*), and Merges (<<:)

# This advanced YAML feature enables the DRY (Don't Repeat Yourself) principle:

# yaml
# # Define an anchor &default_db
# default_config: &default_db
#   host: localhost
#   port: 5432
#   pool_size: 10
# # Reference it using alias *default_db with merge key <<
# services:
#   order_db:
#     <<: *default_db
#     database_name: orders
#   payment_db:
#     <<: *default_db
#     database_name: payments
#     pool_size: 25 # Overrides the default 10
# 2.11 Environment Variables and Placeholders

# IMPORTANT

# YAML Syntax vs. Application Parser: Pure YAML does not expand environment variables like $USER on its own. It simply reads ${VAR} as a raw string literal. The runtime application (such as Spring Boot's property loader, Docker Compose CLI, or GitHub Actions engine) parses those strings and substitutes the environment variable value.

# Spring Boot Syntax: ${DATABASE_URL:jdbc:postgresql://localhost:5432/default} (Uses fallback default after the :).
# Docker Compose Syntax: ${DB_PORT:-5432} (Uses fallback default after :-).
# GitHub Actions Syntax: ${{ secrets.DOCKER_TOKEN }} (Evaluated by GitHub's expression engine before execution).
# 2.12 Special Characters and Quoting Rules

# You must wrap strings in quotes (" or ') if they contain any of the following characters: : (when followed by a space), [, ], {, }, ,, &, *, #, ?, |, -, <, >, =, !, %, @, \

# yaml
# # Invalid (causes parse failure):
# message: Error: connection timed out
# email: user@domain.com
# flag: *special
# # Valid (safely quoted):
# message: "Error: connection timed out"
# email: "user@domain.com"
# flag: "*special"
# 2.13 Valid vs. Invalid YAML Syntax Comparison
# Invalid YAML (Common Syntax Traps)
# yaml
# # ERROR 1: Tab used instead of spaces
# server:
# 	port: 8080
# # ERROR 2: Missing space after colon
# database:
#   host:localhost
# # ERROR 3: Mismatched indentation between siblings
# app:
#   name: order-service
#    version: 1.0.0
# # ERROR 4: List indicator not followed by a space
# items:
#   -item1
# Valid YAML (Correct Formatting)
# yaml
# # CORRECT 1: 2 spaces per level
# server:
#   port: 8080
# # CORRECT 2: Space after colon
# database:
#   host: localhost
# # CORRECT 3: Exact vertical alignment
# app:
#   name: order-service
#   version: 1.0.0
# # CORRECT 4: Space after hyphen
# items:
#   - item1
