# DevOps Exercise 3: Zero-Downtime Ubuntu SSH Deployment Script
# Scenario: Write a deployment job step in GitHub Actions that connects to an Ubuntu server over SSH, navigates to /opt/production, pulls the newest Docker images, reloads the containers without downtime, and removes unused dangling images.
# Solution:
# yaml
# - name: Execute Remote Deployment via SSH
#   uses: appleboy/ssh-action@v1.0.3
#   with:
#     host: ${{ secrets.PROD_SERVER_IP }}
#     username: ${{ secrets.PROD_SSH_USER }}
#     key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
#     port: 22
#     script_stop: true
#     script: |
#       echo "=== Navigating to deployment directory ==="
#       cd /opt/production
#       echo "=== Pulling newest container images ==="
#       docker compose pull
#       echo "=== Recreating updated containers ==="
#       docker compose up -d --remove-orphans
#       echo "=== Cleaning up dangling images ==="
#       docker image prune -f
#       echo "=== Deployment Successfully Completed ==="
# Explanation:
# script_stop: true: Halts the pipeline immediately if any command in the bash script returns a non-zero exit code.
# docker compose up -d --remove-orphans: Recreates only containers whose images or configurations changed.
# docker image prune -f: Reclaims disk space on the remote server by removing old untagged image layers.

