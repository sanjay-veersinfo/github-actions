# ==============================================================================
# GitHub Actions Workflow: Composite Action Invocation Demonstration
# File Location: .github/workflows/composite-action.yml
# ==============================================================================

# 'name': Title displayed in the GitHub Actions tab of the repository
name: Composite Action Example

# 'on': Defines the events that trigger this workflow
on:
  # Trigger 1: Allows manual execution from the GitHub Actions web UI with custom input
  workflow_dispatch:
    inputs:
      username:
        description: "Username to pass to the Composite Action"
        required: false
        default: "GitHub Actions"
        type: string

  # Trigger 2: Automatic execution on push to 'main' or 'development' branch
  push:
    branches:
      - main
      - development

# 'jobs': Groups all jobs within this workflow
jobs:

  # ============================================================================
  # JOB: Execute the local Composite Action
  # ============================================================================
  run-composite-action:
    name: Run Composite Action Job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository files to the runner.
      # CRITICAL RULE: Because the Composite Action is located locally in this repository,
      # the runner MUST check out the code first before it can locate './.github/actions/greeting-action'.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Invoke the local Composite Action using 'uses' at the step level.
      # 'uses': Points to the directory containing 'action.yml'.
      # 'with': Passes inputs declared in the action's inputs definition.
      - name: Execute Greeting Composite Action
        uses: ./.github/actions/greeting-action
        with:
          username: ${{ inputs.username || 'GitHub Actions' }}

      # Step 3: Verify workflow continuation after composite action completes
      - name: Workflow Post-Execution Summary
        run: |
          echo "Caller workflow received success signal from Composite Action."
          echo "All composite steps completed without errors."


# GitHub Actions Composite Action (Definition & Execution)

# The custom Composite Action and its caller workflow have been created and verified at:

# Custom Composite Action: 👉 .github/actions/greeting-action/action.yml
# Caller Workflow: 👉 .github/workflows/composite-action.yml

# (Synchronized reference copies are also preserved in example-yaml-files/greeting-action.yml and example-yaml-files/composite-action.yml)

# 1. What is a Composite Action?

# A Composite Action allows you to package multiple workflow steps (shell scripts, setup routines, third-party actions) into a single reusable action defined in a dedicated action.yml file.

# Why Use a Composite Action?
# Avoid Repetitive Steps: Instead of writing 10 lines of setup steps (e.g., install dependencies, configure CLI tools, run linters) in every job, bundle them into one composite action and invoke it with a single uses: step.
# Pure YAML (No Docker or JavaScript required): Traditional custom actions require NodeJS or Docker containers. Composite actions run native shell scripts directly on the host runner.
# Local or Public: Can live inside your repository (./.github/actions/<action-name>) or in a dedicated public repository for cross-team sharing.
# 2. Composite Action Definition (action.yml)

# The Composite Action is declared inside .github/actions/greeting-action/action.yml:

