# 4. Key Syntax & Operational Mechanics
# A. runs: using: composite

# Unlike JavaScript actions (using: node20) or Docker actions (using: docker), using: composite informs GitHub Actions that this action consists of a list of standard workflow steps.

# B. Mandatory shell: bash

# In standard workflows, shell is optional on Linux runners because it defaults to bash.
# In Composite Actions, every run step MUST explicitly declare shell: (e.g., shell: bash or shell: pwsh). GitHub Actions enforces this because composite actions can execute across Linux, Windows, and macOS runners.

# C. Mandatory actions/checkout@v4

# Because this is a local action (./.github/actions/greeting-action), the runner cannot read action.yml until the workspace has been cloned onto the runner's disk via actions/checkout@v4.

# 5. Composite Action vs. Reusable Workflow
# Feature	Composite Action (action.yml)	Reusable Workflow (workflow_call)
# File Location	Any folder (e.g. .github/actions/<name>/action.yml)	Must be in .github/workflows/<name>.yml
# Invocation Level	Invoked inside steps: via uses:	Invoked at the job: level via uses:
# Engine Keyword	runs: using: composite	on: workflow_call
# Runner Scope	Runs inside the caller job's existing runner	Can define its own dedicated runner (runs-on)
# Job Sharing	Shares the workspace, disk, and environment variables of the calling job	Runs in an isolated virtual machine runner
# Primary Use Case	Packaging repetitive setup scripts, linters, or multi-step CLI operations within a job	Standardizing end-to-end CI/CD pipelines (e.g., full Build 
# →
# → Test 
# →
# → Deploy workflows)
# When to choose which?
# Choose a Composite Action when you need to package 3–5 common steps that run inside an existing job without switching machines or losing local disk files.
# Choose a Reusable Workflow when you need to standardize entire pipelines with multiple jobs, matrices, and independent runners.
