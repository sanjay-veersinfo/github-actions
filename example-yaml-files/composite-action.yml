# 7. Common Pitfalls & Solutions

# WARNING

# Pitfall 1: Missing shell in Composite Steps
# ❌ Error: run step missing shell
# ✔ Fix: Every run step inside action.yml must explicitly specify shell: bash (or pwsh, sh, etc.).

# CAUTION

# Pitfall 2: Omitting actions/checkout@v4
# ❌ Error: Action does not exist: ./.github/actions/greeting-action/action.yml
# ✔ Fix: For local composite actions, always run actions/checkout@v4 as the first step so the action files exist on the runner.

# IMPORTANT

# Pitfall 3: Wrong Calling Location
# ❌ Error: Calling a composite action at the job level.
# ✔ Fix: Composite actions belong inside steps: of a job. Only reusable workflows are called directly under jobs.<job_id>.uses.

