# 3. Understanding the Permission Scopes
# Scope	Value	What It Allows	What It Denies
# contents	read	Git clone, checkout, reading commits, releases, and files.	Pushing commits, creating tags, deleting branches, creating releases.
# contents	write	Pushing code, creating git tags, modifying releases.	Unrelated API actions like modifying issues or pull request reviews.
# issues	read	Fetching issue lists, issue comments, labels, and metadata.	Creating new issues, editing issue titles/bodies, closing issues.
# issues	write	Creating issues, adding comments, closing/reopening, applying labels.	Direct code pushes (unless contents: write is also granted).
# {}	none	Complete revocation. Token has zero permissions on repository resources.	All GitHub API calls to the repository will return HTTP 403.

# IMPORTANT

# The Implicit Deny Rule:
# Once you define the permissions: block with specific keys, any permission scope not explicitly listed is automatically set to none.
# For example, if you declare permissions: { contents: read }, scopes such as issues, pull-requests, packages, and actions are automatically revoked.

# 4. Workflow-Level vs. Job-Level Permissions
# Workflow-Level Permissions

# You can declare permissions: at the root of the workflow (outside jobs:). This sets the default permissions applied to all jobs in the workflow:

# yaml
# # Top of YAML file
# permissions:
#   contents: read
#   issues: read
# jobs:
#   ...
# Job-Level Permissions (Best Practice)

# Defining permissions: inside individual jobs overrides workflow defaults and enforces precision:

# The build/test job receives only contents: read.
# The issue notifier job receives only issues: write.
# The compilation job receives permissions: {}.
