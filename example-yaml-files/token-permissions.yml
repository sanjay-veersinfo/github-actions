# 6. Common Permission Errors & Troubleshooting

# CAUTION

# Error: HTTP 403 Resource not accessible by integration

# Cause: A step in your job attempted a GitHub API call without the required permission scope on GITHUB_TOKEN (for example, attempting github.rest.issues.create while only issues: read or permissions: {} was configured).
# Fix: Add the necessary scope to the job's permissions: block:
# yaml
# permissions:
#   issues: write

# IMPORTANT

# Security Rule: Never Print GITHUB_TOKEN
# GitHub Actions automatically attempts to mask secrets, but printing raw token variables to stdout or log files creates unnecessary exposure. Always pass the token directly to trusted actions via with: github-token: or reference it in github-script via github.token.

