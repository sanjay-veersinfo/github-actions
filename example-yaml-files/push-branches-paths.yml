# ==============================================================================
# GitHub Actions Workflow: Push Event with Branches and Paths Filters
# File Location: .github/workflows/push-branches-paths.yml
# In GitHub Actions, the push event supports several useful configurations. Here are simple YAML examples of what you can do.
# 1. Branch filters
# Execute workflow only for specific branches.
# on:
#   push:
#     branches:
#       - main
#       - development
#       - staging


# 2. Exclude branches
# Execute for all branches except development.
# on:
#   push:
#     branches-ignore:
#       - development
#       - feature/**


# 3. Path filters
# Execute only when files in specific directories change.
# on:
#   push:
#     paths:
#       - 'src/**'
#       - 'backend/**'
#       - 'frontend/**'


# 4. Exclude specific paths
# Execute when files change except README and documentation files.
# on:
#   push:
#     paths-ignore:
#       - 'README.md'
#       - 'docs/**'
#       - '*.txt'


# 5. Branch + Path filters
# Execute only when both branch and path conditions match.
# on:
#   push:
#     branches:
#       - development
#     paths:
#       - 'src/**'
#       - 'package.json'


# 6. Tag filters
# Execute workflow when a version tag is pushed.
# on:
#   push:
#     tags:
#       - 'v1.*'
#       - 'v2.*'


# Example: v1.0.0, v2.1.0.
# 7. Exclude tags
# Execute for all tags except beta releases.
# on:
#   push:
#     tags-ignore:
#       - '*-beta'
#       - '*-alpha'


# 8. Multiple workflows for different branches
# on:
#   push:
#     branches:
#       - main
#       - development
#       - staging

# jobs:
#   branch-info:
#     runs-on: ubuntu-latest
#     steps:
#       - name: Check Branch
#         run: echo "Pushed branch: ${{ github.ref_name }}"


# 9. Run commands based on branch
# on:
#   push:
#     branches:
#       - main
#       - development

# jobs:
#   deploy:
#     runs-on: ubuntu-latest
#     steps:
#       - name: Main Branch
#         if: github.ref == 'refs/heads/main'
#         run: echo "Production branch pushed"

#       - name: Development Branch
#         if: github.ref == 'refs/heads/development'
#         run: echo "Development branch pushed"


# 10. Run workflow when specific files change
# on:
#   push:
#     paths:
#       - 'src/**/*.js'
#       - 'src/**/*.jsx'
#       - 'src/**/*.ts'
#       - 'src/**/*.tsx'


# 11. Exclude a directory using negative patterns
# on:
#   push:
#     paths:
#       - 'src/**'
#       - '!src/tests/**'


# This runs when files under src/ change, excluding src/tests/.
# 12. Run workflow for all branches
# on:
#   push:


# This triggers on pushes to any branch or tag.

# Important GitHub Actions push filters
# Configuration	Purpose
# branches	Include specific branches
# branches-ignore	Exclude specific branches
# paths	Include specific file paths
# paths-ignore	Exclude specific file paths
# tags	Include specific tags
# tags-ignore	Exclude specific tags
# if	Conditionally execute jobs or steps
# github.ref_name	Get branch or tag name
# github.event_name	Get event name

# Important rules:
# - Don't use branches and branches-ignore together in the same event configuration.
# - Don't use paths and paths-ignore together.
# - Use negative patterns (!) inside branches or paths when you need inclusion and exclusion together.
# - Branch and path filters work together using AND logic.
# - Path filters are not evaluated for tag pushes.
# - GitHub applies a 300-file diff limit to push path filtering, which can affect whether a workflow is triggered.
# Recommended next practical exercise
# Try these three scenarios in your JavaScript project:
# 1. Execute only when src/** changes.
# 2. Execute only when development or staging receives a push.
# 3. Execute when src/** changes but exclude src/tests/**.
# ==============================================================================

# 'name': Display title of the workflow shown in the GitHub Actions tab.
name: Push Event - Branches and Paths

# 'on': Specifies the trigger events and conditional filters for the workflow.
on:
  # 'push': Triggers automatically when code is pushed to the repository.
  push:
    # 'branches': Filter that restricts execution to pushes on specific branches.
    branches:
      # Only triggers when code is pushed to the 'development' branch.
      - development

    # 'paths': Filter that restricts execution based on modified file locations.
    paths:
      # Triggers only when at least one modified file is within the 'src/' directory tree.
      # The '**' glob pattern recursively matches all subdirectories and files.
      - 'src/**'

# 'jobs': Groups together all automated tasks defined in this workflow.
jobs:
  # 'push-branches-paths': Unique identifier (job ID) assigned to this job.
  push-branches-paths:
    # 'name': Human-readable job label displayed in the GitHub UI.
    name: Execute Branch and Path Filtered Steps

    # 'runs-on': Specifies the hosted virtual machine environment.
    # 'ubuntu-latest' provides a clean, isolated Ubuntu Linux runner.
    runs-on: ubuntu-latest

    # 'steps': Sequential list of commands and actions to execute.
    steps:
      # Step 1: Display a welcome message confirming filter conditions were met
      # 'name': Step title displayed in execution logs.
      # 'run': Executes shell command (bash on Ubuntu).
      - name: Print Welcome Message
        run: echo "Hello World! Branch and Path filters matched."

      # Step 2: Display successful execution message
      - name: Workflow Completed
        run: echo "Push workflow executed successfully!"


# A. The branches Filter
# Purpose: Dictates which Git branch updates will trigger this workflow.
# Why use development? In Gitflow and trunk-based development, developers continuously push feature and bug-fix commits to development for integration testing. Restricting a pipeline to development prevents unnecessary builds on unrelated branches.
# What happens when code is pushed to main? GitHub checks the incoming Git reference. Because main is not in the branches list, GitHub ignores the event completely. No runner is provisioned, and no build minutes are consumed.
# Can we specify multiple branches? Yes. You can list multiple branches as a YAML array:
# yaml
# branches:
#   - development
#   - staging
#   - 'release/**' # Pattern matching release branches
# B. The paths Filter
# Purpose: Restricts workflow execution based on which files were actually modified in the push.
# What does 'src/**' mean? It is a globbing pattern:
# src/: The target folder at the root of the repository.
# **: A recursive wildcard matching any file, nested subfolder, or deep path inside src/ (e.g., src/index.js, src/components/Header.jsx, src/utils/math/calc.ts).
# How does GitHub identify changed files? When you run git push, GitHub inspects the Git commit history and computes the diff (git diff-tree) between the commit you pushed and the commit previously at the tip of the branch. If at least one changed file matches the paths pattern, the filter passes.
# Can we specify multiple file paths? Yes:
# yaml
# paths:
#   - 'src/**'
#   - 'public/**'
#   - 'package.json'
# C. Combined Conditions: How branches and paths Work Together

# GitHub Actions evaluates the filter conditions using formal boolean logic:

# IMPORTANT

# The Golden Rule of GitHub Actions Event Filters:

# Items within the branches list use OR logic (e.g., branch is development OR staging).
# Items within the paths list use OR logic (e.g., changed file is in src/** OR package.json).
# The relationship between branches and paths uses AND logic. Both must evaluate to true for the workflow to run.
# 3. Practical Examples: Behavior Matrix
# Branch	Changed File	Workflow Status	Reason
# development	src/App.js	Executes ✅	Branch matches (development) AND file matches (src/**).
# development	src/components/Header.js	Executes ✅	Branch matches (development) AND nested file matches (src/**).
# development	README.md	Does not execute ❌	Branch matches, but README.md is outside src/.
# main	src/App.js	Does not execute ❌	File matches, but branch is main (not development).
# main	README.md	Does not execute ❌	Neither branch nor path matches.
# development	package.json	Does not execute ❌	Branch matches, but root config file is outside src/.
# 4. Path Pattern Rules & Common Globs

# GitHub Actions uses the standard fnmatch glob syntax:

# Pattern	Scope	Example Matches
# 'src/**'	Entire src folder recursively	src/App.js, src/styles/theme/dark.css
# '**/*.js'	Any JavaScript file anywhere in the repo	src/App.js, scripts/build.js, test.js
# '**/*.yml'	Any YAML file anywhere in the repo	.github/workflows/deploy.yml, docker-compose.yml
# '.github/workflows/**'	Changes to CI/CD pipeline definitions	.github/workflows/push-event.yml
# 'package.json'	Single exact file match	Only root package.json
# * (Single Star) vs. ** (Double Star)
# * (Single wildcard): Matches characters within a single directory level. It does not cross directory boundaries (/).
# Example: 'src/*' matches src/index.js, but does not match src/components/Button.js.
# ** (Double wildcard / globstar): Matches characters across multiple directory levels recursively.
# Example: 'src/**' matches src/index.js and src/components/Button.js and src/a/b/c/d/deep.js.
# Senior DevOps Pattern: paths-ignore

# If you want a workflow to run on almost everything except documentation or markdown files, use paths-ignore:

# yaml
# on:
#   push:
#     branches:
#       - development
#     paths-ignore:
#       - '**.md'
#       - 'docs/**'
#       - '.gitignore'

# (Note: You cannot use both paths and paths-ignore in the same workflow event).




