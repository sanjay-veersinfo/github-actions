# ==============================================================================
# GitHub Actions Workflow: Checkout and Fetch Depth Demonstration
# File Location: .github/workflows/checkout-fetch-depth.yml
# ==============================================================================

# 'name': The display title of the workflow shown in the GitHub Actions tab.
name: Checkout and Fetch Depth Demo

# 'on': Specifies the event that triggers this workflow.
on:
  # 'workflow_dispatch': Enables manual triggering from the GitHub Actions tab via 'Run workflow'.
  workflow_dispatch:

# 'jobs': Groups together the tasks executed when the workflow runs.
jobs:
  # 'checkout-demo': Unique job identifier (job ID) within this workflow.
  checkout-demo:
    # 'name': Human-readable label displayed in the GitHub Actions execution UI.
    name: Demonstrate Before, Checkout, and After Steps

    # 'runs-on': Specifies the virtual machine runner environment hosted by GitHub.
    # 'ubuntu-latest' allocates a fresh, ephemeral Ubuntu Linux virtual machine.
    runs-on: ubuntu-latest

    # 'steps': A linear sequence of individual tasks executed in strict sequential order.
    steps:
      # ========================================================================
      # STEP 1: BEFORE CHECKOUT
      # At this point, the runner virtual machine has just booted up.
      # The repository has NOT been checked out yet.
      # The current working directory exists ($GITHUB_WORKSPACE), but it is completely empty.
      # Trying to run 'node src/index.js' or 'cat README.md' here would fail with "File not found"!
      # ========================================================================
      - name: Executing Before Checkout
        run: |
          echo "=== 1. Executing Before Checkout ==="
          echo "The repository has NOT been downloaded yet."
          echo ""
          echo "Current working directory:"
          pwd
          echo ""
          echo "Listing files in workspace (should be empty):"
          ls -la

      # ========================================================================
      # STEP 2: CHECKOUT REPOSITORY
      # 'uses': Tells GitHub to download and execute the reusable action 'actions/checkout@v4'.
      # 'with': Keyword used to pass input configuration parameters into the action.
      #
      # 'fetch-depth': Controls the number of commits to fetch from Git history.
      #   * 'fetch-depth: 1' (Default behavior): Shallow clone. Only downloads the single
      #     latest commit. Fast and lightweight, but 'git log' only sees 1 commit.
      #   * 'fetch-depth: 0' (Full history): Fetches all commits, tags, and history across all branches.
      #     Essential for: changelog generators, release versioning tools (e.g., semantic-release),
      #     SonarQube code quality analysis, and inspecting historical 'git log'.
      # ========================================================================
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          # Fetch the complete Git history across all commits
          fetch-depth: 0

      # ========================================================================
      # STEP 3: AFTER CHECKOUT
      # Because actions/checkout completed in Step 2, the source code and the '.git'
      # folder are now fully available inside the working directory.
      # All subsequent steps can now compile code, run tests, and execute Git CLI commands!
      # ========================================================================
      - name: Executing After Checkout
        run: |
          echo "=== 2. Executing After Checkout ==="
          echo "The repository and full Git history are now downloaded and accessible."
          echo ""
          echo "Current working directory:"
          pwd
          echo ""
          echo "Listing files in workspace (source files and .git are now visible):"
          ls -la
          echo ""
          echo "Checking Git repository status:"
          git status
          echo ""
          echo "Checking active branch name:"
          git branch --show-current
          echo ""
          echo "Displaying the 5 most recent Git commits (made possible by fetch-depth: 0):"
          git log --oneline -5



# fetch-depth: 1 vs. fetch-depth: 0

# Behind the scenes, actions/checkout runs Git commands on the runner.

# fetch-depth: 1 (The Default Behavior)

  

  
# Underlying Git Command: git clone --depth=1 ...

  
# What it does: Downloads only the single most recent commit at the tip of the branch (a shallow clone).

  
# Advantages: Blazing fast. If your repository has 20,000 commits over 5 years, downloading 1 commit takes seconds and saves bandwidth.

  
# Limitations:
  
  

  
# If you run git log, you will only see 1 commit.

  
# Cannot calculate release changelogs between Git tags.

  
# Tools like SonarQube (code quality) will fail to attribute blame lines or calculate new code metrics.

  
# Versioning tools like semantic-release or GitVersion will fail because they cannot see past version tags.

  

  
# fetch-depth: 0 (Full Git History)

  

  
# Underlying Git Command: git clone (without --depth limits) and git fetch --unshallow --tags.

  
# What it does: Downloads the entire commit history, all branches, and all tags.

  
# Advantages:
  
  

  
# Complete commit history is visible (git log shows every historical commit).

  
# Automated versioning tools can inspect previous version tags (v1.0.0, v1.1.0) to compute next versions.

  
# Git diffs can compare against any remote branch (git diff origin/main).

  

  
# DevOps Performance Note:
  

  

# TIP


  

#   For small to medium repositories (a few hundred commits), fetch-depth: 0 adds negligible overhead (1–2 seconds). For massive enterprise repositories with hundreds of thousands of commits and large binary histories, fetch-depth: 0 can increase clone times significantly. Use fetch-depth: 0 only when tools explicitly require historical commits.