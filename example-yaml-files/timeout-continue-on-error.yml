# 3. Detailed Concept Breakdown
# A. Step-Level Timeout vs. Job-Level Timeout
# Step-Level (step-timeout-demo): Applies only to a single operation (e.g., an external API call or test suite). If that step exceeds the duration, GitHub sends a termination signal (SIGTERM followed by SIGKILL), marks the step as failed, and skips all subsequent steps in that job by default.
# Job-Level (job-timeout-demo): Sets an upper bound on the cumulative time taken by all steps in that job combined (checkout + setup + build + test). If the cumulative time hits the threshold, the entire runner job is killed immediately.

# TIP

# Always configure a reasonable job-level timeout-minutes (e.g., timeout-minutes: 10 or 15) on production pipelines. This prevents an unexpected infinite loop or frozen third-party install from burning through 360 minutes of runner allocation.

# B. Step-Level vs. Job-Level continue-on-error
# Step-Level (continue-on-error-demo):
# Tolerates the failure of a specific step. Subsequent steps in the same job execute normally, and the overall job can finish with status success (green checkmark).
# Job-Level (job-continue-on-error-demo):
# Tolerates the failure of an entire job. Downstream jobs linked via needs: will still execute without requiring if: always(), because GitHub treats the failed job's workflow impact as non-fatal.
# C. Combining timeout-minutes with continue-on-error

# In Example 5:

# yaml
# - name: Timed-Out Step with Continue-on-Error
#   timeout-minutes: 1
#   continue-on-error: true
#   run: sleep 120

# When sleep 120 reaches the 1-minute timeout, GitHub terminates it. Because continue-on-error: true is present, GitHub catches the timeout error, marks the step with an orange warning, and allows the job to proceed to the next step.

# 4. Comparison Table: timeout-minutes vs. continue-on-error
# Feature	timeout-minutes	continue-on-error
# Primary Goal	Prevent runaway jobs and conserve compute minutes.	Prevent non-critical failures from breaking the pipeline.
# Trigger Condition	Elapsed wall-clock time exceeds limit.	Command exits with a non-zero status code (exit > 0).
# Default Behavior Without It	Runs up to 360 minutes (6 hours).	Any failure (exit 1) immediately aborts the job.
# Step UI Status	Red 'X' (Failed / Timed Out).	Orange Exclamation Circle (Failed, but tolerated).
# Subsequent Steps	Skipped (unless guarded by if: always()).	Run normally as if the step succeeded.
# Common Use Cases	Test suites, network downloads, deployment commands.	Code linters, coverage upload, experimental matrices, flaky tests.
