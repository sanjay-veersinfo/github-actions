# Open your repository on GitHub.
# Go to the Actions tab.
# Select Cache Basics Example in the left sidebar.
# Click Run workflow 
# →
# → select main 
# →
# → click the green Run workflow button.
# Open the running job Node.js Dependency Cache (actions/cache).
# Expand the Restore npm Cache step: observe Cache not found for input keys.
# Expand Display Cache Status: observe Exact Cache Hit: 'false'.
# Expand the Post Restore npm Cache step at the bottom: observe Cache saved successfully with key: Linux-node-....

# Trigger Second Run (Cache Hit):

# Trigger the workflow again manually using Run workflow.
# Open the new execution logs.
# Expand the Restore npm Cache step: observe Cache restored successfully from key: Linux-node-....
# Expand Display Cache Status: observe Exact Cache Hit: 'true'.
# In the Post Restore npm Cache step, observe that saving is skipped because the exact key already exists.

# Test Cache Invalidation:

# Add a lightweight dependency or update package.json / package-lock.json.
# Push the change.
