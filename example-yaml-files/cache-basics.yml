# 3. Understanding the Cache Key Structure

# In Job 1, the cache key is constructed using:

# yaml
# key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
# Line-by-Line Breakdown:
# ${{ runner.os }}: Evaluates to the operating system of the runner (e.g., Linux, Windows, or macOS). This prevents binary incompatibility when compiling or using platform-specific dependencies.
# node: A static descriptive prefix identifying the runtime/purpose of the cache.
# hashFiles('package-lock.json'): Evaluates the SHA-256 cryptographic checksum of package-lock.json. If any dependency is added, updated, or removed, the hash changes completely.
# Example Concrete Key:
# text
# Linux-node-7b89d44f651c6c08e5e89d53347065ec01b8764f43423b01859942a78d052d91

# TIP

# Why cache ~/.npm instead of node_modules?
# When running npm ci in continuous integration, npm will automatically delete the existing node_modules folder before installation begins to guarantee a pure, clean build. If you cache node_modules, npm ci deletes it immediately, wasting the time spent downloading the cache! By caching ~/.npm (npm's internal package tarball store), npm ci extracts packages directly from the local disk cache without making remote network calls.

# 4. How restore-keys Fallback Works

# The restore-keys setting defines a list of alternative prefix keys searched sequentially if no exact key match is found:

# yaml
# restore-keys: |
#   ${{ runner.os }}-node-
# Resolution Lifecycle:
# Exact Key Search: GitHub Actions looks for Linux-node-<current_hash>.
# Prefix Fallback: If not found, it looks for the most recently created cache beginning with Linux-node-.
# Partial Benefit: Even though package-lock.json changed, 95% of packages are usually identical. npm restores the older cached packages from disk and downloads only the newly added/updated packages over the internet.
# Cache Miss: If no prefix matches, the runner starts with an empty cache.
# 5. Interpreting steps.npm-cache.outputs.cache-hit

# The actions/cache action exposes a single output: cache-hit.

# Value	Meaning	Typical Workflow Impact
# 'true'	An exact cache key was matched and restored.	Dependencies were entirely present in cache. Zero remote downloads required.
# 'false'	Exact key was not found (either a cache miss OR a fallback restore-keys match occurred).	New or modified dependencies will be downloaded from the npm registry. A new cache will be saved at the end of the job.
# Empty	The step failed or was skipped.	No cache interaction.

# IMPORTANT

# When a cache is restored via restore-keys prefix matching, cache-hit is false. This is intentional because GitHub Actions needs to know that the exact key is missing so it can save an updated cache entry at the end of the job.

# 6. Built-in Caching: actions/setup-node

# In Job 2, the built-in caching provided by actions/setup-node@v4 is used:

# yaml
# - name: Setup Node.js With Built-in Cache
#   uses: actions/setup-node@v4
#   with:
#     node-version: 22
#     cache: npm
#     cache-dependency-path: package-lock.json
# Why Built-in Caching is Recommended:
# No boilerplate: Eliminates 15+ lines of YAML configuration.
# Cross-platform accuracy: Automatically selects ~/.npm on Linux/macOS and %LocalAppData%\npm-cache on Windows.
# Standardized keys: Automatically handles OS identification and lockfile hashing.
# Multi-package manager support: Supports npm, yarn, and pnpm with a single property (cache: npm | yarn | pnpm).
# 7. Workflow Execution Scenarios
# Scenario A: First Workflow Run (Cold Cache / Cache Miss)
# Restore npm Cache: Searches for Linux-node-<hash> 
# →
# → Not Found (Cache Miss).
# Install Dependencies: npm ci connects to registry.npmjs.org, downloads tarballs, and populates ~/.npm and node_modules.
# Run Tests: npm test executes the test suite.
# Post Cache Step (Automatic): After the job completes successfully, the action archives ~/.npm and stores it in GitHub's cache storage tagged as Linux-node-<hash>.
# Scenario B: Second Workflow Run (Warm Cache / Exact Cache Hit)
# Restore npm Cache: Searches for Linux-node-<hash> 
# →
# → Found (Cache Hit: true).
# Restoration: GitHub Actions pulls the archive and extracts ~/.npm onto the runner in seconds.
# Install Dependencies: npm ci reads directly from the local disk cache. Network bandwidth is saved and execution speed increases significantly.
# Run Tests: Tests execute normally.
# Post Cache Step: Because an exact match was restored, saving is skipped (caches are immutable).
# 8. Core Concepts, Limitations & Best Practices
# 1. What is caching?

# Caching stores frequently downloaded external dependencies (such as npm modules, Maven packages, or pip wheels) and intermediate build outputs in GitHub's high-speed cloud storage so subsequent jobs do not have to download or recompile them from scratch.

# 2. Why is caching useful in CI/CD?
# Speed: Drastically reduces total pipeline runtime (shorter feedback loop).
# Reliability: Decreases vulnerability to external registry outages or intermittent network timeouts.
# Bandwidth: Conserves compute minutes and data transfer limits.
# 3. What is the difference between actions/cache and actions/setup-node caching?
# actions/cache: Generic caching mechanism for any file or folder (custom build artifacts, compiler caches like ccache, custom directories).
# setup-node: High-level wrapper built on top of actions/cache that pre-configures paths, lockfiles, and keys specifically for Node.js package managers.
# 4. Cache vs. Artifact: What is the difference?
# Feature	GitHub Actions Cache	GitHub Actions Artifact (actions/upload-artifact)
# Primary Purpose	Accelerate builds by reusing dependencies.	Pass build outputs between jobs or retain deployment binaries/test reports.
# Lifecycle	Persists across separate workflow runs.	Scoped to a single workflow run (by default).
# Reliability	Best-effort (can be evicted if quota is exceeded).	Guaranteed retention for configured duration (default: 90 days).
# Downloadable	Not directly downloadable from GitHub UI.	Downloadable as a ZIP archive directly from the run summary.
# 5. Cache Limitations & Eviction Policy:
# 10 GB Repository Limit: Each repository has a total cache limit of 10 GB.
# Least Recently Used (LRU) Eviction: Once the 10 GB threshold is reached, GitHub automatically deletes the oldest untouched caches to free space.
# 7-Day Retention: Any cache not accessed in 7 days is permanently deleted.
# Immutability: Once a cache is created under a specific key, it cannot be modified. To refresh or update a cache, you must change the key (e.g., updating dependencies changes the hashFiles output).
# Branch Scope Isolation:
# A workflow run on main can access caches created on main.
# A workflow run on a feature branch (or PR) can access caches from its own branch and from the default branch (main), but cannot access sibling feature branches.
# A feature branch cannot overwrite caches on main.
# Security: Never cache sensitive data such as API tokens, private SSH keys, .env files, or passwords.
