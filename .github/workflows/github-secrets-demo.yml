# ==============================================================================
# GitHub Actions Workflow: GitHub Actions Secrets & Secure Usage Demonstration
# File Location: .github/workflows/github-secrets-demo.yml
# Secrets are encrypted key-value pairs stored securely within GitHub. They allow your automated workflows to access database passwords, cloud tokens, API keys, and SSH credentials without hardcoding them into YAML files or Git history.
# Why Secrets are Mandatory (vs. Plain Environment Variables):
# Plain env: variables are visible in plaintext to anyone who can read your repository. They appear in Git history and commit logs.
# Secrets are never shown again after being created (even repository admins cannot read a secret's value after saving it).
# Automatic Log Masking: If a script accidentally prints a secret value, GitHub’s runner automatically intercepts the string and masks it as ***
# 3. How and Where to Create Secrets in GitHub

# To create the secrets used in our demonstration:

# Open your repository on GitHub.
# Click Settings in the top navigation bar.
# In the left sidebar, expand Secrets and variables 
# →
# → click Actions.
# In the Repository secrets section, click the green New repository secret button.
# Enter the Name and Secret value, then click Add secret:
# Secret Name	Example Purpose	Sample Value (for testing)
# DEMO_API_KEY	External API Authentication	api_key_test_987654321
# DB_USERNAME	PostgreSQL User	postgres_admin
# DB_PASSWORD	PostgreSQL Password	supersecretpassword123
# DEMO_TOKEN	Service Authentication Token	ghp_mocktoken999888777

# 4. Understanding Secret Scopes: Repository vs. Environment vs. Organization

# GitHub provides three layers of secret scoping:

# A. Repository-Level Secrets
# Configured under Settings 
# →
# → Secrets and variables 
# →
# → Actions.
# Available to all workflows in the repository unless overridden by an environment secret.
# Best for general CI tokens, SonarQube keys, or Docker Hub credentials.
# B. Environment-Level Secrets
# Configured under Settings 
# →
# → Environments (e.g. development, staging, production).
# Only accessible to jobs that explicitly declare environment: <name>.
# Supports Protection Rules: required reviewers, deployment branch restrictions, and wait timers.
# Allows you to use the same secret name (DB_PASSWORD) with different values for staging vs. production!
# C. Organization-Level Secrets
# Configured by organization administrators across multiple repositories.
# Managed centrally with access policies (e.g., "All repositories", "Private repositories only", or "Selected repositories").
# Prevents having to manually copy shared enterprise credentials into 50 different microservice repositories.
# 5. How to Use Secrets Securely in Workflows
# The Gold Standard: Map Secrets to Environment Variables

# Always bind secrets using the env: block on the step:

# yaml
# - name: Deploy to Cloud
#   env:
#     API_TOKEN: ${{ secrets.DEMO_TOKEN }}
#   run: |
#     # The shell consumes $API_TOKEN securely
#     ./deploy.sh
# Why Passing via env: is Safer Than Command Arguments:
# Command arguments (./deploy.sh --token "${{ secrets.DEMO_TOKEN }}"): Can be inspected by process listing tools (ps aux) running on the host OS.
# Environment variables (env:): Handled in-memory by the subshell process and not exposed in process argument tables.

# 6. Critical Security Rules for Senior DevOps Engineers

# CAUTION

# Never use echo "$API_KEY": Never attempt to print secrets to the console.
# Never print context objects: Running echo "${{ toJSON(secrets) }}" is blocked by GitHub, but attempting to dump serialized contexts can leak credentials.
# Masking is not infallible: GitHub masks exact matches of secrets. If a secret is base64-encoded or URL-encoded, GitHub's string-matching filter may not recognize it and could print it in plaintext!
# Forked Pull Request Security: Workflows triggered by pull_request from a forked repository do not receive repository secrets. This prevents external contributors from submitting PRs designed to steal your credentials.
# ==============================================================================

# 'name': Display title of the workflow shown in the GitHub Actions tab.
name: GitHub Actions Secrets Demo

# 'on': Specifies the event that triggers this workflow.
on:
  # 'workflow_dispatch': Allows manual execution from the GitHub Actions tab via 'Run workflow'.
  workflow_dispatch:

# 'jobs': Groups together the tasks executed when the workflow runs.
jobs:

  # ----------------------------------------------------------------------------
  # JOB 1: REPOSITORY-LEVEL SECRETS DEMONSTRATION
  # Demonstrates how to access repository-level secrets securely using the
  # 'secrets' context and map them to environment variables.
  # ----------------------------------------------------------------------------
  api-demo:
    name: Repository-Level Secrets Validation
    runs-on: ubuntu-latest

    steps:
      # ========================================================================
      # STEP 1: VALIDATE API SECRET
      # 'env': Safely maps '${{ secrets.DEMO_API_KEY }}' to the shell variable '$API_KEY'.
      # SECURITY RULE: Never print the secret value directly (e.g., echo "$API_KEY").
      # Instead, verify its presence using conditional checks ([ -n "$API_KEY" ]).
      # ========================================================================
      - name: Validate API Secret
        env:
          # Map GitHub secret to a step-level environment variable
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "=== 1. Validating API Key Secret ==="
          if [ -n "$API_KEY" ]; then
            echo "SUCCESS: DEMO_API_KEY is configured and available in runner environment."
          else
            echo "NOTICE: DEMO_API_KEY is NOT set in GitHub Repository Secrets."
            echo "Tip: Configure this secret under Repository Settings -> Secrets and variables -> Actions."
          fi

      # ========================================================================
      # STEP 2: DEMONSTRATE DATABASE CREDENTIALS MAPPING
      # Demonstrates mapping multiple credentials (username & password) to environment variables.
      # This pattern is used for Spring Boot, PostgreSQL, and Go database connections.
      # ========================================================================
      - name: Validate Database Credentials
        env:
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "=== 2. Validating Database Credentials ==="
          if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
            echo "SUCCESS: Both DB_USERNAME and DB_PASSWORD are configured."
          else
            echo "NOTICE: Database credentials are not configured or incomplete."
          fi

      # ========================================================================
      # STEP 3: DEMONSTRATE PASSING SECRETS TO AN API CLIENT
      # Shows how application scripts or CLI tools consume tokens via environment variables
      # without ever exposing them in command-line arguments or log files.
      # ========================================================================
      - name: Execute API Client Simulation
        env:
          API_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "=== 3. Executing Simulated API Client ==="
          if [ -z "$API_TOKEN" ]; then
            echo "NOTICE: DEMO_TOKEN is missing. Application would halt in strict mode."
          else
            echo "SUCCESS: API token is configured. Client is ready to authenticate securely."
          fi

  # ----------------------------------------------------------------------------
  # JOB 2: ENVIRONMENT-LEVEL SECRETS DEMONSTRATION
  # 'environment: development': Links this job to the 'development' environment
  # configured in GitHub Repository Settings.
  # This grants access to environment-specific secrets and applies protection rules.
  # ----------------------------------------------------------------------------
  environment-demo:
    name: Environment-Level Secrets Validation
    runs-on: ubuntu-latest

    # Select the GitHub environment configured in repository settings.
    # Required to access environment-scoped secrets and trigger deployment protection rules!
    environment: development

    steps:
      # Step A: Validate environment-scoped secret
      - name: Validate Development Environment Secret
        env:
          # If configured under Environment 'development', this overrides repository-level secrets
          DEV_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "=== 4. Validating Environment-Level Secret (development) ==="
          if [ -n "$DEV_API_KEY" ]; then
            echo "SUCCESS: Development environment secret is available."
          else
            echo "NOTICE: Environment secret is not configured for 'development'."
            echo "Tip: Add an environment named 'development' in Settings -> Environments."
          fi

      # Step B: Summary completion message
      - name: Secrets Demo Completed
        run: |
          echo "GitHub Actions Secrets demonstration completed successfully!"

