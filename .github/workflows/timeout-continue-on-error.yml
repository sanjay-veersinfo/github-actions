# ==============================================================================
# GitHub Actions Workflow: Timeout and Continue-on-Error Basics Demonstration
# File Location: .github/workflows/timeout-continue-on-error.yml
# ==============================================================================

# 'name': Title of the workflow displayed in the GitHub Actions tab
name: Timeout and Continue-on-Error Basics

# 'on': Triggers that execute this workflow
on:
  # Trigger 1: Allows manual workflow execution directly from GitHub Actions web UI
  workflow_dispatch:

  # Trigger 2: Automatic execution on push to 'main' or 'development' branch
  push:
    branches:
      - main
      - development

# 'jobs': Groups all demonstration jobs
# NOTE: Jobs execute independently and in parallel by default unless 'needs' is specified.
jobs:

  # ============================================================================
  # 1. EXAMPLE 1: STEP-LEVEL TIMEOUT
  # Demonstrates 'timeout-minutes: 1' applied directly to an individual step.
  # When the step exceeds 1 minute, GitHub terminates it with an error.
  # By default, subsequent steps are SKIPPED because the job has failed.
  # ============================================================================
  step-timeout-demo:
    name: Step-Level Timeout Demo
    runs-on: ubuntu-latest

    steps:
      # Step 1: Initial banner
      - name: Log Start of Step Timeout Demo
        run: |
          echo "=========================================="
          echo "Step-Level Timeout Demonstration Started"
          echo "Configured Timeout: 1 minute (60 seconds)"
          echo "=========================================="

      # Step 2: Simulate a long-running task that exceeds the configured timeout
      # 'timeout-minutes: 1': Caps execution time of this specific step.
      # 'sleep 120': Simulates a 2-minute task. It will be killed at 1 minute!
      - name: Simulate Long Running Task (Times Out)
        timeout-minutes: 1
        run: |
          echo "Task started at $(date -u)..."
          echo "Simulating long process with 'sleep 120'..."
          sleep 120
          echo "Task completed (this line will never be reached)."

      # Step 3: Default behavior verification
      # Because the previous step timed out, this step is automatically SKIPPED.
      - name: Subsequent Step (Skipped on Failure)
        run: |
          echo "This step was skipped because the previous step timed out."

      # Step 4: Optional cleanup step using 'if: always()'
      # Proves that status-check functions like always() can still run after a timeout.
      - name: Post-Timeout Cleanup
        if: always()
        run: |
          echo "Cleanup step executed via 'if: always()' despite step timeout."

  # ============================================================================
  # 2. EXAMPLE 2: JOB-LEVEL TIMEOUT
  # Demonstrates 'timeout-minutes: 2' applied at the JOB level.
  # Limits the cumulative execution time of the entire job across all its steps.
  # Default GitHub Actions job timeout is 360 minutes (6 hours).
  # ============================================================================
  job-timeout-demo:
    name: Job-Level Timeout Demo
    runs-on: ubuntu-latest

    # Job-level timeout: entire job is killed if total time exceeds 2 minutes
    timeout-minutes: 2

    steps:
      - name: Log Start of Job Timeout Demo
        run: |
          echo "=========================================="
          echo "Job-Level Timeout Demonstration Started"
          echo "Overall Job Timeout: 2 minutes (120 seconds)"
          echo "=========================================="

      # Step that exceeds the 2-minute job limit
      - name: Simulate Long Running Job (Times Out)
        run: |
          echo "Job started at $(date -u)..."
          echo "Simulating operation with 'sleep 180' (3 minutes)..."
          sleep 180
          echo "Job finished (this line will never be reached)."

  # ============================================================================
  # 3. EXAMPLE 3: STEP-LEVEL CONTINUE-ON-ERROR
  # Demonstrates 'continue-on-error: true' on an individual step.
  # When a step fails (e.g., 'exit 1'), GitHub marks the step as failed (orange icon),
  # but allows the remaining steps to execute and the job to complete successfully.
  # ============================================================================
  continue-on-error-demo:
    name: Step-Level Continue-on-Error Demo
    runs-on: ubuntu-latest

    steps:
      - name: Log Start of Continue-on-Error Demo
        run: |
          echo "=========================================="
          echo "Step-Level Continue-on-Error Demonstration"
          echo "=========================================="

      # Step that fails intentionally using 'exit 1'
      # 'continue-on-error: true': Prevents this failure from halting the job.
      - name: Simulate Failure with Continue-on-Error
        continue-on-error: true
        run: |
          echo "Simulating a non-critical step failure (e.g., linter warning or flaky test)..."
          echo "Exiting with code 1..."
          exit 1

      # This step executes normally because the previous failure was tolerated!
      - name: Continue After Failure
        run: |
          echo "=========================================="
          echo "SUCCESS: The workflow continued after the failed step!"
          echo "The previous step failed, but 'continue-on-error: true' kept the job alive."
          echo "=========================================="

  # ============================================================================
  # 4. EXAMPLE 4: JOB-LEVEL CONTINUE-ON-ERROR
  # Demonstrates 'continue-on-error: true' configured at the JOB level.
  # If the job fails, GitHub records the failure but treats the job outcome as
  # successful from the perspective of dependent jobs in the workflow.
  # ============================================================================
  job-continue-on-error-demo:
    name: Job-Level Continue-on-Error Demo
    runs-on: ubuntu-latest

    # Job-level continue-on-error: workflow tolerates failure of this entire job
    continue-on-error: true

    steps:
      - name: Simulate Job-Level Failure
        run: |
          echo "Simulating failure across the entire job..."
          exit 1

  # Stage that depends on the failed job above
  downstream-job:
    name: Downstream Job (Tolerated Dependency)
    runs-on: ubuntu-latest

    # Waits for 'job-continue-on-error-demo'
    needs: job-continue-on-error-demo

    steps:
      - name: Verify Downstream Execution
        run: |
          echo "=========================================="
          echo "Downstream job executed successfully!"
          echo "Upstream 'job-continue-on-error-demo' failed, but its failure was tolerated."
          echo "=========================================="

  # ============================================================================
  # 5. EXAMPLE 5: COMBINING TIMEOUT WITH CONTINUE-ON-ERROR
  # Demonstrates a step with BOTH 'timeout-minutes: 1' and 'continue-on-error: true'.
  # When the timeout terminates the step, continue-on-error catches the failure,
  # allowing subsequent steps in the job to proceed.
  # ============================================================================
  timeout-with-continue-on-error:
    name: Timeout Combined with Continue-on-Error
    runs-on: ubuntu-latest

    steps:
      # Step with both timeout and failure tolerance
      - name: Timed-Out Step with Continue-on-Error
        timeout-minutes: 1
        continue-on-error: true
        run: |
          echo "Task started with 1-minute timeout AND continue-on-error: true..."
          sleep 120
          echo "Task finished (not reached)."

      # Executes successfully even after the previous step timed out!
      - name: Step After Timed-Out Step
        run: |
          echo "=========================================="
          echo "Execution continued after timeout!"
          echo "The timeout terminated Step 1, but continue-on-error allowed Step 2 to run."
          echo "=========================================="
