# 3. Core Concurrency Mechanics
# A. Concurrency Group (group:)

# A concurrency group is an arbitrary string that acts as an exclusive lock:

# Dynamic Group: ${{ github.workflow }}-${{ github.ref }} evaluates to something like Concurrency Basics-refs/heads/development. This isolates concurrency per branch, meaning runs on development won't block or cancel runs on feature-branch.
# Static Group: group: production-deploy locks across all branches and commits, ensuring only one job in the entire repository can deploy to production at any moment.
# B. cancel-in-progress: true vs. cancel-in-progress: false
# Setting	Behavior When Newer Run Arrives	Best Use Case
# cancel-in-progress: true	Immediately terminates the currently running job/workflow and starts the new one.	CI Pipelines: Pull request testing, code linting, unit tests. (Saves runner minutes).
# cancel-in-progress: false	Allows the active job to finish completely. The new job waits in a pending state.	CD Pipelines: Deployments, database migrations, publishing packages. (Prevents corruption).

# WARNING

# Never set cancel-in-progress: true on deployment jobs or database migration steps! Cancelling an active deployment midway through can leave your production infrastructure in an undefined, broken state.

# 4. Workflow-Level vs. Job-Level Concurrency
# Workflow-Level Concurrency

# Placed at the root of the YAML file:

# yaml
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

# Applies to the entire workflow run. If a newer commit arrives, all jobs in the older workflow run are cancelled immediately.

# Job-Level Concurrency (Override)

# Placed inside a specific job definition:

# yaml
# jobs:
#   deploy:
#     concurrency:
#       group: deployment-${{ github.ref }}
#       cancel-in-progress: false

# Allows testing and preparation jobs to run freely and cancel early on new commits, while locking only the deployment job so deployments serialize safely without overlapping.

# 5. GitHub Actions Concurrency Queueing Limits

# A common misconception is that GitHub Actions maintains an infinite First-In, First-Out (FIFO) queue for concurrency groups.

# GitHub's Queue Limit Rule: For any single concurrency group, GitHub Actions permits:

# 1 Active (Running) Job
# At most 1 Pending Job

# If Run #1 is running and Run #2 is pending, and Run #3 is triggered:

# Run #3 cancels and replaces Run #2 in the queue.
# Run #1 finishes, and Run #3 executes next.
# This prevents huge queues of outdated intermediate builds from building up.
# 6. Pull Request Concurrency Pattern

# For pull request workflows, use the PR number fallback pattern:

# yaml
# concurrency:
#   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#   cancel-in-progress: true
# On a Pull Request: resolves to CI-142 (where 142 is the PR number). Whenever the author pushes a new commit to the PR, the previous run is cancelled immediately.
# On a direct branch push: falls back to github.ref (e.g., CI-refs/heads/main).
