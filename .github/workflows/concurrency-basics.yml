# 9. Step-by-Step UI Verification & Testing Guide

# To see concurrency in action in the GitHub Actions UI:

# Verify Files on Disk:

# bash
# git status

# Commit and Push:

# bash
# git add .github/workflows/concurrency-basics.yml
# git commit -m "ci: add concurrency groups and cancellation demonstration workflow"
# git push origin main

# Test cancel-in-progress: true in GitHub Actions:

# Go to the Actions tab in your repository.
# Select Concurrency Basics in the left sidebar.
# Click Run workflow 
# →
# → click Run workflow (Run #1 starts).
# Immediately (within 5 seconds), click Run workflow again (Run #2 starts).
# In the workflow runs list, observe:
# Run #1 changes status to grey with an icon indicating: "Cancelled".
# Run #2 executes to completion.
# You have just witnessed cancel-in-progress: true conserving compute resources!
