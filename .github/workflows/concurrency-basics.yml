# ==============================================================================
# GitHub Actions Workflow: Concurrency Basics Demonstration
# File Location: .github/workflows/concurrency-basics.yml
# ==============================================================================

# 'name': Title of the workflow displayed in the GitHub Actions tab
name: Concurrency Basics

# 'on': Triggers that execute this workflow
on:
  # Trigger 1: Allows manual workflow execution directly from GitHub Actions web UI
  workflow_dispatch:

  # Trigger 2: Automatic execution on push to the 'development' branch
  push:
    branches:
      - development

# ==============================================================================
# 1. WORKFLOW-LEVEL CONCURRENCY
# Controls concurrent executions of this entire workflow for the same branch.
# 'group': A dynamic group string constructed from workflow name and git ref.
# 'cancel-in-progress: true': Cancels any currently running workflow in this
# group when a newer commit or run is triggered on the same branch.
# ==============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 'jobs': Groups all demonstration jobs
jobs:

  # ============================================================================
  # JOB 1: BUILD AND TEST STAGE
  # Inherits workflow-level concurrency (${{ github.workflow }}-${{ github.ref }}).
  # If a developer pushes a new commit while this job is running, this job is
  # automatically cancelled immediately, saving GitHub runner minutes.
  # ============================================================================
  build:
    name: Build & Test Stage
    runs-on: ubuntu-latest

    steps:
      - name: Log Start of Build Stage
        run: |
          echo "=========================================="
          echo "Build & Test started for branch: ${{ github.ref_name }}"
          echo "Workflow Run ID: ${{ github.run_id }}"
          echo "=========================================="

      # Simulate a long-running build or test suite (15 seconds)
      - name: Simulate Build & Test Execution
        run: |
          echo "Compiling application source code..."
          sleep 5
          echo "Executing automated test suite..."
          sleep 10
          echo "=========================================="
          echo "Build and tests completed successfully!"
          echo "=========================================="

  # ============================================================================
  # JOB 2: DEPLOYMENT STAGE (JOB-LEVEL CONCURRENCY)
  # Uses dedicated job-level concurrency to safeguard the deployment target.
  # 'cancel-in-progress: false': NEVER cancels an in-progress deployment!
  # If another deployment triggers for the same group, it waits safely until this
  # active deployment completes, avoiding race conditions or corrupted releases.
  # ============================================================================
  deploy:
    name: Simulated Deployment Stage
    runs-on: ubuntu-latest

    # Enforces sequential dependency: deployment runs only after build succeeds
    needs: build

    # --------------------------------------------------------------------------
    # Job-Level Concurrency Definition
    # Overrides workflow-level concurrency specifically for this deployment job.
    # --------------------------------------------------------------------------
    concurrency:
      # Dedicated lock group for deployments to this specific branch/environment
      group: deployment-${{ github.ref }}

      # Set to 'false' so active deployments are NEVER terminated midway through
      cancel-in-progress: false

    steps:
      - name: Log Start of Deployment Stage
        run: |
          echo "=========================================="
          echo "Deployment started."
          echo "Target Ref: ${{ github.ref }}"
          echo "Active Concurrency Group: deployment-${{ github.ref }}"
          echo "=========================================="

      # Step-by-step simulated deployment with duration
      - name: Execute Deployment
        run: |
          echo "Preparing deployment..."
          sleep 5
          echo "Deployment in progress..."
          sleep 10
          echo "Verifying service health checks..."
          sleep 5
          echo "=========================================="
          echo "Deployment completed successfully."
          echo "=========================================="


# 1. What is Concurrency in GitHub Actions?

# When developers push several commits in quick succession, open multiple pull requests, or trigger workflows repeatedly, GitHub Actions runs those workflows simultaneously by default.

# Running simultaneous workflows causes two major problems:

# Wasted Compute Minutes: Running tests on an older commit when a newer commit has already been pushed wastes runner minutes.
# Deployment Race Conditions: Two jobs deploying to the same server or environment at the same time can overwrite files, run conflicting database migrations, or leave the server in a corrupted state.

# The concurrency keyword ensures that only one run or job within a designated concurrency group executes at any given time.

