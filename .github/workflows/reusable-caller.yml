# ==============================================================================
# GitHub Actions Caller Workflow (Invokes Reusable Callee Workflow)
# File Location: .github/workflows/reusable-caller.yml
# ==============================================================================

# 'name': Title of the caller workflow displayed in GitHub Actions UI
name: Reusable Caller Workflow

# 'on': Triggers for executing the caller workflow
on:
  # Trigger 1: Allows manual execution with configurable input fields from GitHub UI
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Name to pass to callee"
        required: false
        default: "Sample Node App"
        type: string
      environment:
        description: "Environment to pass to callee"
        required: false
        default: "Development"
        type: string

  # Trigger 2: Automatic execution on push to 'main' or 'development' branch
  push:
    branches:
      - main
      - development

# 'jobs': Groups all jobs in the caller workflow
jobs:

  # ============================================================================
  # CALLER JOB: Invokes the reusable callee workflow
  # CRITICAL RULES FOR CALLER JOBS:
  # 1. Caller jobs use the 'uses' keyword at the job level (NOT inside steps).
  # 2. DO NOT define 'runs-on' or 'steps' in this job. The callee defines them.
  # 3. For local workflows in the same repository, use the relative path:
  #    './.github/workflows/<filename>.yml'
  # 4. Use the 'with' keyword to pass input parameters to the callee.
  # 5. Use the 'secrets' keyword to pass secrets (or 'secrets: inherit').
  # ============================================================================
  call-reusable-workflow:
    name: Invoke Reusable Callee
    # 'uses': Specifies the path to the callee workflow file
    uses: ./.github/workflows/reusable-callee.yml

    # 'with': Supplies values for the inputs declared under 'workflow_call.inputs' in the callee
    with:
      app_name: ${{ inputs.app_name || 'Sample Node App' }}
      environment: ${{ inputs.environment || 'Development' }}

    # 'secrets': (Optional) Passes secrets to the callee workflow.
    # Note: If no DEPLOY_TOKEN secret is configured in the repository, the callee
    # safely handles the empty value without errors.
    secrets:
      deploy_token: ${{ secrets.DEPLOY_TOKEN }}


# What is a Reusable Workflow?

# In continuous integration and deployment (CI/CD), software teams frequently repeat the same deployment, testing, and security scanning routines across multiple repositories and workflows.

# Instead of copying and pasting identical YAML code, GitHub Actions allows you to treat a workflow like a reusable function:

# Callee Workflow (Reusable): Defines what tasks to execute and declares which parameters (inputs) and credentials (secrets) it accepts using the workflow_call trigger.
# Caller Workflow (Consumer): Invokes the callee workflow using the uses keyword at the job level and passes runtime arguments using with: and secrets:.
# 2. Callee Workflow Implementation (reusable-callee.yml)

# The callee defines the reusable logic, required inputs, and the runner environment.

