#       5. Detailed Breakdown of Keywords & Mechanics
# A. on: workflow_call (In the Callee)
# Designates the workflow as callable by other workflows.
# Defines the input interface under inputs: (name, type, required status, default value).
# Defines acceptable secrets under secrets: (name, required status).
# B. uses at the Job Level (In the Caller)

# In standard workflows, uses: is placed inside steps: to run an action (like actions/checkout@v4). However, for reusable workflows:

# uses: is placed directly under the job key:
# yaml
# jobs:
#   my-job:
#     uses: ./.github/workflows/reusable-callee.yml
# Local reference syntax: Local reusable workflows in the same repository must start with ./ and reside inside .github/workflows/.
# External reference syntax: If calling a workflow from another repository, reference it as:
# yaml
# uses: my-org/shared-workflows/.github/workflows/deploy.yml@v1
# C. with: vs. secrets:
# with: (Inputs): Used for non-sensitive values like environment names, application names, build flags, and versions. These values are readable in the workflow logs.
# secrets: (Credentials): Used for private tokens, passwords, and API keys. GitHub automatically masks these values in logs.
# secrets: inherit shortcut: Instead of passing secrets one-by-one, caller workflows can pass:
# yaml
# secrets: inherit
# This automatically grants the callee access to all secrets available to the caller.
# 6. Expected Execution Logs

# When you run reusable-caller.yml, GitHub Actions provisions a runner for the callee job. The logs will display:

# text
# ==========================================
# Reusable workflow started!
# ==========================================
# Application Name: Sample Node App
# Environment:      Development
# Secret Status: No 'deploy_token' supplied by caller (standard mode).
# ==========================================
# Reusable workflow completed successfully!
# ==========================================
# 7. Important Rules & Common Mistakes

# IMPORTANT

# Rule 1: Caller jobs must NOT contain runs-on or steps
# ❌ Invalid:

# yaml
# call-reusable-workflow:
#   runs-on: ubuntu-latest    # ERROR!
#   uses: ./.github/workflows/reusable-callee.yml
#   steps:                     # ERROR!
#     - run: echo "Hi"

# ✔ Valid: The caller job defines only uses, with, secrets, and optionally needs or if. The callee specifies runs-on and steps.

# WARNING

# Rule 2: Do NOT call a reusable workflow from inside steps
# ❌ Invalid:

# yaml
# steps:
#   - uses: ./.github/workflows/reusable-callee.yml  # ERROR: Only actions can be run in steps!

# NOTE

# Rule 3: Maximum Nesting Depth
# GitHub Actions allows up to 4 levels of nesting:
# Caller Workflow 
# →
# → Callee 1 
# →
# → Callee 2 
# →
# → Callee 3.

# 8. Step-by-Step UI Verification & Testing Guide
# Verify Files on Disk:
# bash
# git status
# Commit and Push:
# bash
# git add .github/workflows/reusable-callee.yml .github/workflows/reusable-caller.yml
# git commit -m "ci: add reusable workflow caller and callee demonstration"
# git push origin main
# Trigger Workflow in GitHub UI:
# Go to your repository on GitHub.
# Click the Actions tab.
# Select Reusable Caller Workflow in the left sidebar.
# Click Run workflow. Notice the input fields app_name and environment are pre-populated with default values.
# Click the green Run workflow button.
# Inspect the Workflow Graph:
# Click the active workflow run.
# In the run visualization, notice Invoke Reusable Callee displays a special reusable workflow icon indicating it delegates execution to reusable-callee.yml.
# Click into the job to inspect the logs showing inputs received and processed.