# ==============================================================================
# GitHub Actions Workflow: Dependency Caching Basics Demonstration
# File Location: .github/workflows/cache-basics.yml
# ==============================================================================

# 'name': Display name shown in GitHub Actions web interface
name: Cache Basics Example

# 'on': Defines the events that trigger workflow execution
on:
  # Trigger 1: Automatically execute on push to 'main' or 'development'
  push:
    branches:
      - main
      - development

  # Trigger 2: Automatically execute on Pull Requests targeting 'main' or 'development'
  pull_request:
    branches:
      - main
      - development

  # Trigger 3: Allow manual execution directly from GitHub Actions UI
  workflow_dispatch:

# 'jobs': Groups all caching demonstration jobs
jobs:

  # ============================================================================
  # JOB 1: Explicit Caching Using 'actions/cache@v4'
  # Demonstrates how actions/cache works under the hood with explicit keys,
  # restore-keys fallbacks, cache paths, and cache-hit inspection.
  # ============================================================================
  build:
    name: Node.js Dependency Cache (actions/cache)
    runs-on: ubuntu-latest

    # Working directory is the repository root where package.json & lockfile reside
    defaults:
      run:
        working-directory: .

    steps:
      # Step 1: Download the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment (version 22 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Restore or prepare to save npm cache using actions/cache@v4
      - name: Restore npm Cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          # 'path': Directory where npm stores downloaded package tarballs
          # NOTE: On Linux/macOS runners, this is ~/.npm (on Windows, it is %LocalAppData%\npm-cache)
          path: ~/.npm

          # 'key': Primary unique key computed from OS name and hash of the lock file
          # If package-lock.json changes, hashFiles() produces a new SHA-256 hash
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

          # 'restore-keys': Ordered prefix fallback search if exact key is not found
          # Useful when adding/updating dependencies so only changed packages are downloaded
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install project dependencies
      # 'npm ci' checks the ~/.npm cache before making any network requests.
      # If cached, dependencies are installed from local disk, saving download time.
      - name: Install Dependencies
        run: |
          npm ci

      # Step 5: Check whether an exact cache hit occurred
      # 'steps.npm-cache.outputs.cache-hit' evaluates to:
      # - 'true': Exact cache key matched and was restored
      # - 'false': No exact key matched (either cache miss or fallback restore-key used)
      - name: Display Cache Status
        run: |
          echo "=== Cache Hit Status Inspection ==="
          echo "Exact Cache Hit: '${{ steps.npm-cache.outputs.cache-hit }}'"
          if [ "${{ steps.npm-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Result: Exact cache match restored successfully! Dependencies loaded from cache."
          else
            echo "Result: Cache miss or partial fallback key restored. Fresh packages were downloaded."
          fi

      # Step 6: Execute the test suite using existing Node.js test runner
      - name: Run Tests
        run: |
          echo "Running unit tests against sample math module..."
          npm test

  # ============================================================================
  # JOB 2: Built-in Caching Using 'actions/setup-node@v4'
  # Demonstrates the modern, streamlined approach where setup-node configures
  # caching automatically, eliminating the need for a separate actions/cache step.
  # ============================================================================
  setup-node-cache:
    name: Cache Using Setup Node (Built-in)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      # Step 1: Download repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js and enable automatic npm cache management
      # Under the hood, actions/setup-node utilizes actions/cache logic with
      # optimal defaults for ~/.npm and automatic lockfile hashing.
      - name: Setup Node.js With Built-in Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22

          # Enable npm dependency caching automatically
          cache: npm

          # Specify lock file path used to generate cache key
          cache-dependency-path: package-lock.json

      # Step 3: Install dependencies using the restored npm cache
      - name: Install Dependencies
        run: |
          npm ci

      # Step 4: Execute application unit tests
      - name: Run Tests
        run: |
          echo "Executing test suite with setup-node built-in cache..."
          npm test
