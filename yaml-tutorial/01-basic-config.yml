# ==============================================================================
# Basic Application Configuration Example
# Demonstrates key-value pairs, nested objects, lists, numbers, booleans, and nulls
# ==============================================================================

app:
  name: "E-Commerce Gateway"
  version: "2.4.1"
  environment: "production"
  maintenance_mode: false       # Boolean: true or false
  timeout_seconds: 30           # Integer
  cache_ratio: 0.85             # Float
  deprecation_notice: null      # Null value (can also be written as ~)

server:
  host: "0.0.0.0"
  port: 8080
  ssl:
    enabled: true
    certificate_path: "/etc/ssl/certs/server.crt"

cors:
  allowed_origins:
    - "https://app.example.com"
    - "https://admin.example.com"
    - "http://localhost:3000"

features:
  user_registration: true
  beta_checkout: false
  max_retry_attempts: 3

