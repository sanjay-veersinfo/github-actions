# ==============================================================================
# Spring Boot Configuration: application.yml
# Location in Spring Boot: src/main/resources/application.yml
# ==============================================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: order-service

  datasource:
    # Environment variable placeholders with default fallback syntax ${VAR_NAME:default_value}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
    com.example.orderservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

